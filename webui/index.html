<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1.0,user-scalable=0" />
    <meta name="theme-color" content="#0b0f18" />
    <title>Agent eBPF Filter</title>
    <link data-trunk rel="rust" data-bin="agent-webui" data-bindgen-target="web" data-keep-debug />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f18; }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #a9b6cc;
        font: 14px/1.4 system-ui, sans-serif;
        pointer-events: none;
      }
      body:has(canvas) #boot { display: none; }
    </style>
  </head>
  <body>
    <div id="boot">Loading GPUI WebAssembly dashboard…</div>
  </body>
</html>
