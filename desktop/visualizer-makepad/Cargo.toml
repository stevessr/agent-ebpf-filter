[package]
name = "agent-ebpf-codecity"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "Unprivileged Makepad 3D visualizer for Agent eBPF CodeSpace events"

# Pin the Makepad 3D renderer API to the inspected upstream revision.
[dependencies]
makepad-widgets = { git = "https://github.com/makepad/makepad", rev = "71c9ddcbb9c01dd208f99621fdd71024a5d35c65", default-features = false }
makepad-xr = { git = "https://github.com/makepad/makepad", rev = "71c9ddcbb9c01dd208f99621fdd71024a5d35c65" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
