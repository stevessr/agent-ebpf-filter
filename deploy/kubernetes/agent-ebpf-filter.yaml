apiVersion: v1
kind: Namespace
metadata:
  name: agent-ebpf-filter
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-ebpf-filter-token
  namespace: agent-ebpf-filter
type: Opaque
stringData:
  # Replace before production use. The backend accepts this value through
  # X-API-KEY, Authorization: Bearer, or ?key= on authenticated endpoints.
  AGENT_API_KEY: change-me
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-ebpf-filter
  namespace: agent-ebpf-filter
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent-ebpf-filter
  namespace: agent-ebpf-filter
  labels:
    app.kubernetes.io/name: agent-ebpf-filter
    app.kubernetes.io/component: node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-ebpf-filter
      app.kubernetes.io/component: node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-ebpf-filter
        app.kubernetes.io/component: node-agent
    spec:
      serviceAccountName: agent-ebpf-filter
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: agent-ebpf-filter
          image: ghcr.io/stevessr/agent-ebpf-filter:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: GIN_MODE
              value: release
            - name: AGENT_BACKEND_PORT
              value: "8080"
            - name: AGENT_CGROUP_SANDBOX_PATH
              value: /sys/fs/cgroup
            - name: AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-ebpf-filter-token
                  key: AGENT_API_KEY
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: cgroupfs
              mountPath: /sys/fs/cgroup
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: runtime-state
              mountPath: /root/.config/agent-ebpf-filter
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: cgroupfs
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: runtime-state
          hostPath:
            path: /var/lib/agent-ebpf-filter
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: agent-ebpf-filter
  namespace: agent-ebpf-filter
  labels:
    app.kubernetes.io/name: agent-ebpf-filter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-ebpf-filter
    app.kubernetes.io/component: node-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
