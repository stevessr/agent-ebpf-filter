name: one-shot path rule fast reject hardening

on:
  push:
    branches:
      - perf/path-rule-fast-reject

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/path-rule-fast-reject
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply transactional path-mode hardening
        run: python3 .github/scripts/one_shot_path_rule_fast_reject_hardening.py
      - name: Format Go sources
        run: |
          gofmt -w backend/app/runtime_ebpf.go backend/app/handlersbridge.go backend/app/server_mcp.go
      - name: Assert transactional selector publication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r = Path('backend/app/runtime_ebpf.go').read_text()
          h = Path('backend/app/handlersbridge.go').read_text()
          m = Path('backend/app/server_mcp.go').read_text()
          for needle in (
              'var trackingModeMutationMu sync.Mutex',
              'func putTrackedSelector(',
              'func deleteTrackedSelector(',
              'func rollbackTrackedSelector(',
              'forceTrackingModePathAny(set.TrackingMode)',
          ):
              if needle not in r:
                  raise SystemExit(f'missing transactional path-mode helper: {needle}')
          if 'trackingModeMutationMu.Lock()' not in r:
              raise SystemExit('selector mutation is not serialized')
          if 'target.Lookup(key, &previous)' not in r:
              raise SystemExit('selector mutation does not snapshot prior value')
          if 'return rollbackTrackedSelector' not in r:
              raise SystemExit('selector mode failure does not rollback')
          for method, helper in (
              ('TrackedPathsPut', 'putTrackedSelector'),
              ('TrackedPathsDelete', 'deleteTrackedSelector'),
              ('TrackedPrefixesPut', 'putTrackedSelector'),
              ('TrackedPrefixesDelete', 'deleteTrackedSelector'),
          ):
              pos = h.find(f' {method}(')
              end = h.find('\n}\n', pos)
              block = h[pos:end]
              if pos < 0 or helper not in block:
                  raise SystemExit(f'{method} bypasses transactional helper')
          if 'putTrackedSelector(&trackerMaps, trackerMaps.TrackedPaths, k, tid)' not in m:
              raise SystemExit('MCP path mutation bypasses transactional helper')
          PY
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto proto/tracker_registration.proto \
            proto/tracker_system.proto proto/tracker_config.proto proto/tracker_shell.proto
      - name: Generate repository eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Regression tests
        working-directory: backend
        run: |
          go test ./app -run 'Test(TrackingModeFlags|TracepointNameFromTag)' -count=1
          go test ./app/observability -count=1
          go test ./app/captureprofile -count=1
          go test ./app/events -run 'Test(Kernel|BuildKernel|HTTP|Socket|Audit)' -count=1
          go test ./app/tls -run 'Test.*(API|Fingerprint|HTTP|GRPC)' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Verify generated bindings stay clean
        run: git diff --exit-code -- backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go
      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/runtime_ebpf.go backend/app/handlersbridge.go backend/app/server_mcp.go \
            docs/backend/generic-api-capture.md
          git commit -m 'perf(ebpf): make path-mode publication transactional'
          git push
