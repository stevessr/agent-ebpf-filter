name: Magpie AstrLink Guard plugin tests

on:
  push:
    paths:
      - 'integrations/magpie-astrlink-guard/**'
      - '.github/workflows/magpie-astrlink-guard.yml'
  pull_request:
    paths:
      - 'integrations/magpie-astrlink-guard/**'
      - '.github/workflows/magpie-astrlink-guard.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JS hook and middleware tests
        run: node --test integrations/magpie-astrlink-guard/tests/*.test.mjs
      - name: Python scanner HTTP and decoder tests (offline mocks)
        run: python3 -m unittest discover -s integrations/magpie-astrlink-guard/tests -p 'test_*.py'

  model-cpu-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/magpie-astrlink-guard/requirements-cpu.txt
      - name: Install ONNX CPU dependencies
        run: pip install -r integrations/magpie-astrlink-guard/requirements-cpu.txt
      - name: Download pinned AstrLink Guard 0.1.3 INT8 model
        run: |
          python - <<'PYMODEL'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='QuantumNous/astrlink-guard', revision='v0.1.3',
                            local_dir='/tmp/astrlink-guard-model', allow_patterns=['int8/*'])
          PYMODEL
      - name: Run actual ONNX inference smoke test
        run: python integrations/magpie-astrlink-guard/tests/smoke_cpu.py /tmp/astrlink-guard-model
