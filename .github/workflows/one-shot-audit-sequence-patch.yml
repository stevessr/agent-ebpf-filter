name: one-shot audit sequence patch

on:
  push:
    branches:
      - feat/ebpf-audit-sequence-tls-diagnostics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ebpf-audit-sequence-tls-diagnostics
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          python3 .github/scripts/one_shot_audit_patch.py
          gofmt -w \
            backend/core/types.go \
            backend/app/kernel_audit_clock.go \
            backend/app/kernel_audit_clock_test.go \
            backend/app/kernelriskbridge.go \
            backend/app/events/envelope_event.go \
            backend/app/observability/metrics_collector.go \
            backend/app/collectormetricsbridge.go \
            backend/app/tls/probemanager_lifecycletls.go \
            backend/app/tls/probemanager_readlooptls.go \
            backend/app/tls/probemanagertls.go \
            backend/app/tls/probemanagertls_test.go
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend proto docs
          git commit -m "feat(audit): add kernel provenance and harden TLS capture"
          git push origin HEAD:feat/ebpf-audit-sequence-tls-diagnostics
