name: ML security validation

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/app/ml/**"
      - "backend/app/autotune*.go"
      - "backend/app/risk_scoring*.go"
      - "backend/app/features.go"
      - "backend/ebpf/**"
      - "backend/go.mod"
      - "backend/go.sum"
      - "proto/**"
      - "frontend/src/components/config/ml/**"
      - "frontend/src/composables/config/**"
      - "frontend/src/data/mlModel*.ts"
      - "frontend/src/types/config/**"
      - "frontend/package.json"
      - "frontend/bun.lock"
      - ".github/workflows/ml-security.yml"
  pull_request:
    paths:
      - "backend/app/ml/**"
      - "backend/app/autotune*.go"
      - "backend/app/risk_scoring*.go"
      - "backend/app/features.go"
      - "backend/ebpf/**"
      - "backend/go.mod"
      - "backend/go.sum"
      - "proto/**"
      - "frontend/src/components/config/ml/**"
      - "frontend/src/composables/config/**"
      - "frontend/src/data/mlModel*.ts"
      - "frontend/src/types/config/**"
      - "frontend/package.json"
      - "frontend/bun.lock"
      - ".github/workflows/ml-security.yml"

permissions:
  contents: read

concurrency:
  group: ml-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ml:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto \
            proto/tracker_events.proto \
            proto/tracker_registration.proto \
            proto/tracker_system.proto \
            proto/tracker_config.proto \
            proto/tracker_shell.proto
      - name: Generate eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: ML package tests
        working-directory: backend
        run: go test ./app/ml -count=1
      - name: Attack-risk app tests
        working-directory: backend
        run: go test ./app -run 'TestAttackVectorScores|TestAttackRiskClass' -count=1

  frontend-ml:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck and build
        run: bun run build
