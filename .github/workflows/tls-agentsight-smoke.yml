name: TLS and AgentSight smoke

on:
  workflow_dispatch:
  push:
    branches:
      - perf/tls-agentsight-refresh
    paths:
      - "backend/app/tls/**"
      - "backend/app/handlers/agentsight*.go"
      - "backend/app/platform/**"
      - "backend/ebpf/**"
      - "backend/go.mod"
      - "backend/go.sum"
      - "proto/**"
      - "frontend/src/components/agentsight/**"
      - "frontend/src/composables/agentsight/**"
      - "frontend/src/utils/agentsight.ts"
      - "frontend/src/utils/agentsight/**"
      - "frontend/tests/**"
      - "frontend/package.json"
      - "frontend/bun.lock"
      - ".github/workflows/tls-agentsight-smoke.yml"

concurrency:
  group: tls-agentsight-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto \
            proto/tracker_events.proto \
            proto/tracker_registration.proto \
            proto/tracker_system.proto \
            proto/tracker_config.proto \
            proto/tracker_shell.proto
      - name: Generate eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: TLS package tests
        working-directory: backend
        run: go test ./app/tls -count=1
      - name: AgentSight backend tests
        working-directory: backend
        run: go test ./app/handlers -count=1

  frontend-agentsight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: AgentSight utility tests
        run: bun run test:agentsight
      - name: Typecheck and build
        run: bun run build
