name: ML calibration regression
on:
  pull_request:
    paths: ['backend/app/ml/**', '.github/workflows/ml-calibration.yml']
  push:
    branches: [master]
    paths: ['backend/app/ml/**', '.github/workflows/ml-calibration.yml']
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: false
      - name: Generate protobuf bindings
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto \
            proto/tracker_registration.proto proto/tracker_system.proto \
            proto/tracker_config.proto proto/tracker_shell.proto
      - name: ML calibration tests
        run: cd backend && go test ./app/ml -count=1
