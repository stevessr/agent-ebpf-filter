name: Frontend build

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
      # Temporary bootstrap to regenerate the integrity for a new npm-only asset package.
      - name: Resolve new icon package integrity
        run: |
          bun install
          grep -F '"@lobehub/icons-static-svg": [' bun.lock
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck and build
        run: bun run build
