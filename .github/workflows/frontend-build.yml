name: Frontend build

on:
  pull_request:
    paths:
      - "frontend/**"
      - "proto/**"
      - ".github/workflows/frontend-build.yml"
  push:
    paths:
      - "frontend/**"
      - "proto/**"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run all frontend unit tests
        run: bun test tests
      - name: Measure 50K-event Harness capture throughput
        run: bun scripts/benchmark-harness-capture.ts
      - name: Upload Harness benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-capture-benchmark
          path: frontend/artifacts/harness-benchmarks/
          if-no-files-found: warn
          retention-days: 14
      - name: Test core-only workbench routes
        run: VITE_AGENT_BUILD_FEATURES=core bun run test:workbench
      - name: Typecheck and build
        run: bun run build
