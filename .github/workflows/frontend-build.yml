name: Frontend build

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test harness icon mappings
        run: bun test tests/harness-icons.test.ts
      - name: Test system color-scheme switching
        run: bun test tests/system-theme.test.ts
      - name: Test bilingual locale switching
        run: bun test tests/i18n.test.ts
      - name: Typecheck and build
        run: bun run build
  page-acceptance:
    needs: build
    name: Pages (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/webui-playwright" --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/webui-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start Vite web server
        run: |
          bun run dev -- --host 127.0.0.1 --port 5173 > /tmp/agent-webui-vite.log 2>&1 &
          echo $! > /tmp/agent-webui-vite.pid
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/agent-webui-vite.log
          exit 1
      - name: Accept pages in Chinese and English
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/webui-playwright/node_modules/playwright
          WEBUI_SHARD: ${{ matrix.shard }}
          WEBUI_SHARD_COUNT: "4"
          WEBUI_URL: http://127.0.0.1:5173
        run: node scripts/test-i18n-pages.mjs
      - name: Upload per-page screenshots and JSON verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-i18n-pages-${{ matrix.shard }}
          path: frontend/artifacts/webui-i18n/shard-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Show Vite logs on failure
        if: failure()
        run: cat /tmp/agent-webui-vite.log || true
