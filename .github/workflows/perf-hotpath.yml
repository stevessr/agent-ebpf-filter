name: Backend hot path regression
on:
  pull_request:
    paths: ['backend/app/observability/**', 'backend/app/handlers/native_hook*', 'backend/app/statepersistenceruntime.go', 'backend/app/tls/probemanager_readlooptls.go', '.github/workflows/perf-hotpath.yml']
  push:
    branches: [master]
    paths: ['backend/app/observability/**', 'backend/app/handlers/native_hook*', '.github/workflows/perf-hotpath.yml']
jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: false
      - name: Generate protobuf and eBPF
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto \
            proto/tracker_registration.proto proto/tracker_system.proto \
            proto/tracker_config.proto proto/tracker_shell.proto
          (cd backend/ebpf && go generate)
      - name: Run hot-path and hook tests
        run: cd backend && go test ./app/handlers ./app/observability ./app -run 'Test.*(Hot|NativeHook|Metric|Settings)' -count=1
