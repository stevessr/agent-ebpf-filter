name: Backend hot path regression
on:
  pull_request:
    paths: ['backend/**', 'proto/**', 'go.work', 'go.work.sum', '.github/workflows/perf-hotpath.yml']
  push:
    branches: [master]
    paths: ['backend/**', 'proto/**', 'go.work', 'go.work.sum', '.github/workflows/perf-hotpath.yml']
permissions:
  contents: read
jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: false
      - name: Generate protobuf and eBPF
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto \
            proto/tracker_registration.proto proto/tracker_system.proto \
            proto/tracker_config.proto proto/tracker_shell.proto
          (cd backend/ebpf && go generate)
      - name: Run hot-path and hook tests
        working-directory: backend
        run: |
          go test ./app/handlers ./app/observability ./app/events ./internal/wsfanout ./internal/agentpipeline -count=1
          go test ./app -run 'Test.*(Hot|NativeHook|UnifiedAgentRisk|Metric|Settings|BackendListenHost|ListenBackend|WebSocket|HTTPRouter|Authentication|AuthMiddleware|DesktopUnixServer|TLSCaptureWebSocketRoute|Broadcast|RuntimeEventLog|RuntimeEventStore)' -count=1
      - name: Race-check shared event paths
        run: cd backend && go test -race ./internal/wsfanout ./internal/agentpipeline ./app/observability ./app/events ./app/recording ./redaction ./core -count=1
      - name: Record event construction microbenchmarks
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          go test ./app/events -run '^$' -bench '^BenchmarkBuildKernelEvent' -benchmem -count=5 | tee hotpath-bench.txt
      - name: Upload baseline evidence (not an end-to-end performance claim)
        uses: actions/upload-artifact@v4
        with:
          name: hotpath-bench-${{ github.sha }}
          path: backend/hotpath-bench.txt
          if-no-files-found: error
