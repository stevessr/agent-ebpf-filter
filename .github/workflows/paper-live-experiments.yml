name: Paper live experiments (real CI host)

on:
  push:
    branches: ['research/**']
    paths:
      - '.github/workflows/paper-live-experiments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-capabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record kernel and LSM availability
        run: |
          set -uo pipefail
          mkdir -p reports/paper-ci/capabilities
          {
            date -u
            git rev-parse HEAD
            uname -a
            lscpu | grep -E 'Model name|CPU\(s\)|Core\(s\)|Socket\(s\)' || true
            printf 'active LSM list: '
            cat /sys/kernel/security/lsm || true
            printf 'BTF available: '
            test -r /sys/kernel/btf/vmlinux && echo yes || echo no
            printf 'cgroup root writable: '
            test -w /sys/fs/cgroup && echo yes || echo no
            printf 'cgroup type: '
            stat -f -c %T /sys/fs/cgroup || true
            printf 'bpffs mounted: '
            mountpoint -q /sys/fs/bpf && echo yes || echo no
          } | tee reports/paper-ci/capabilities/host.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-ci-kernel-capabilities
          path: reports/paper-ci/capabilities/
          retention-days: 30

  experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - name: Run real syscall, Agent, and conditional LSM experiments
        shell: bash
        run: bash scripts/paper-ci-live.sh
      - name: Summarize raw data without inventing measurements
        if: always()
        run: |
          python3 scripts/paper-ci-summarize.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload raw evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-live-experiments-ci-host
          path: reports/paper-ci/
          if-no-files-found: warn
          retention-days: 30
