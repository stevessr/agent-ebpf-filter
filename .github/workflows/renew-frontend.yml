name: Renew frontend

on:
  pull_request:
    paths:
      - "frontend/src/views/renew/**"
      - "frontend/src/components/renew/**"
      - "frontend/src/composables/renew/**"
      - "frontend/tests/renew*.test.ts"
      - "frontend/package.json"
      - "frontend/bun.lock"
      - ".github/workflows/renew-frontend.yml"
  push:
    paths:
      - "frontend/src/views/renew/**"
      - "frontend/src/components/renew/**"
      - "frontend/src/composables/renew/**"
      - "frontend/tests/renew*.test.ts"
      - "frontend/package.json"
      - "frontend/bun.lock"
      - ".github/workflows/renew-frontend.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Test Renew
        run: bun run test:renew
      - name: Typecheck and build frontend
        run: bun run build
