name: one-shot untracked network fast reject

on:
  push:
    branches:
      - perf/untracked-network-fast-reject

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/untracked-network-fast-reject
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply untracked network fast reject
        run: python3 .github/scripts/one_shot_untracked_network_fast_reject.py
      - name: Assert early reject ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('backend/ebpf/agent_tracker_syscalls.h').read_text()
          for name in ('bind', 'recvfrom'):
              start = s.index(f'int tracepoint__syscalls__sys_enter_{name}')
              end = s.index('\n}\n', start)
              block = s[start:end]
              lookup = block.index('u32 tag_id = get_tag_id')
              reject = block.index('if (tag_id == 0) return 0;')
              store = block.index('store_exit_meta')
              if not (lookup < reject < store):
                  raise SystemExit(f'{name}: zero-tag reject is not before exit-context store')
              if name == 'bind':
                  decode = block.index('fill_network_meta')
                  if not reject < decode:
                      raise SystemExit('bind: sockaddr decode happens before zero-tag reject')
          PY
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto proto/tracker_registration.proto \
            proto/tracker_system.proto proto/tracker_config.proto proto/tracker_shell.proto
      - name: Generate repository eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Capture and audit regression tests
        working-directory: backend
        run: |
          go test ./app/captureprofile -count=1
          go test ./app/events -run 'Test(Kernel|BuildKernel|HTTP|Socket|Audit)' -count=1
          go test ./app/tls -run 'Test.*(API|Fingerprint|HTTP|GRPC)' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Verify generated binding drift
        run: git diff --exit-code -- backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/ebpf/agent_tracker_syscalls.h docs/backend/generic-api-capture.md
          git commit -m 'perf(ebpf): fast reject untracked network syscalls'
          git push
