name: one-shot context pressure observability

on:
  push:
    branches:
      - perf/context-pressure-observability

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/context-pressure-observability
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply context pressure observability
        run: python3 .github/scripts/one_shot_context_pressure_observability.py
      - name: Format Go sources
        run: |
          gofmt -w backend/core/types.go backend/app/runtime_ebpf.go backend/app/observabilitybridge.go \
            backend/app/observability/deps.go backend/app/observability/metrics_collector.go \
            backend/app/observability/metrics_collector_test.go backend/app/observability/metrics_prometheus.go
      - name: Assert failure-only instrumentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c = Path('backend/ebpf/agent_tracker_common.h').read_text()
          t = Path('backend/ebpf/agent_tracker_tail.h').read_text()
          s = Path('backend/ebpf/agent_tracker_syscalls.h').read_text()
          if 'context_pressure_stats SEC(".maps")' not in c or 'sizeof(struct context_pressure_stats) == 48' not in c:
              raise SystemExit('missing per-cpu context pressure stats ABI')
          if 'if (rc < 0) record_context_update_failure(CONTEXT_PRESSURE_EXIT_FULL);' not in c:
              raise SystemExit('full exit store not failure-only instrumented')
          if 'if (rc < 0) record_context_update_failure(CONTEXT_PRESSURE_EXIT_COMPACT);' not in c:
              raise SystemExit('compact exit store not failure-only instrumented')
          for text in (t, s):
              if 'bpf_map_update_elem(&exit_single_path_ctx' in text or 'bpf_map_update_elem(&exit_path_ctx' in text:
                  raise SystemExit('direct path-context update bypasses checked helper')
          r = Path('backend/app/runtime_ebpf.go').read_text()
          if 'context_pressure_stats' not in r or 'ContextPressureStats' not in r:
              raise SystemExit('runtime is missing pressure stats map')
          if '&set.SocketFds' not in r or '&set.SocketFdParents' not in r or '&set.ExitCompactCtx' not in r:
              raise SystemExit('tracker map close path still leaks correlation/provenance handles')
          PY
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto proto/tracker_registration.proto \
            proto/tracker_system.proto proto/tracker_config.proto proto/tracker_shell.proto
      - name: Generate repository eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Observability and runtime tests
        working-directory: backend
        run: |
          go test ./app/observability -count=1
          go test ./app -run '^TestTracepointNameFromTag$' -count=1
          go test ./app/captureprofile -count=1
          go test ./app/events -run 'Test(Kernel|BuildKernel|HTTP|Socket|Audit)' -count=1
          go test ./app/tls -run 'Test.*(API|Fingerprint|HTTP|GRPC)' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Assert generated context stats bindings
        run: |
          grep -q 'ContextPressureStats.*ebpf:"context_pressure_stats"' backend/ebpf/agenttracker_bpfel.go
          grep -q 'ContextPressureStats.*ebpf:"context_pressure_stats"' backend/ebpf/agenttracker_bpfeb.go
          grep -q 'type AgentTrackerContextPressureStats struct' backend/ebpf/agenttracker_bpfel.go
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/core/types.go backend/app/runtime_ebpf.go backend/app/observabilitybridge.go \
            backend/app/observability/deps.go backend/app/observability/metrics_collector.go \
            backend/app/observability/metrics_collector_test.go backend/app/observability/metrics_prometheus.go \
            backend/ebpf/agent_tracker_common.h backend/ebpf/agent_tracker_tail.h backend/ebpf/agent_tracker_syscalls.h \
            backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go docs/backend/generic-api-capture.md
          git commit -m 'perf(ebpf): expose correlation map pressure'
          git push
