name: Renew dependency refresh

on:
  push:
    branches:
      - feat/renew-webui-zh-deps
    paths:
      - ".github/workflows/renew-dependency-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
      - name: Refresh compatible frontend dependencies
        run: >-
          bun update
          vue
          @vitejs/plugin-vue
          vue-tsc
          axios
          protobufjs
          acorn
          smol-toml
          @types/node
          apexcharts
          vue3-apexcharts
          @ant-design/icons-vue
      - name: Commit refreshed manifest and lockfile
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- frontend/package.json frontend/bun.lock; then
            echo "No dependency updates available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/bun.lock
          git commit -m "chore(frontend): refresh compatible dependencies"
          git push
