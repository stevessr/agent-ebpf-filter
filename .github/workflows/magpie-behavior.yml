name: Magpie behavior middleware

on:
  push:
    paths:
      - "integrations/magpie/agent-ebpf-behavior/**"
      - ".github/workflows/magpie-behavior.yml"
  pull_request:
    paths:
      - "integrations/magpie/agent-ebpf-behavior/**"
      - ".github/workflows/magpie-behavior.yml"

permissions:
  contents: read

jobs:
  behavior-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check integrations/magpie/agent-ebpf-behavior/behavior.middleware.js
      - name: Test Magpie policy and stream audit
        run: node --test integrations/magpie/agent-ebpf-behavior/behavior.test.mjs
      - name: Verify Magpie plugin manifest and offline dependency boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          const dir = 'integrations/magpie/agent-ebpf-behavior'
          const p = JSON.parse(fs.readFileSync(dir + '/package.json', 'utf8'))
          assert.equal(p.magpie.middleware, './behavior.middleware.js')
          assert.equal(p.magpie.options.mode, 'audit')
          assert.equal(p.private, true)
          assert.equal(typeof p.dependencies, 'undefined')
          NODE

  upstream-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: agent-ebpf-filter
      - name: Checkout pinned yetone/magpie (actual moejs plugin host)
        uses: actions/checkout@v7.0.1
        with:
          repository: yetone/magpie
          ref: 71f796069f9078295b54e26d1f790bf38e087c6c
          path: magpie-upstream
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: magpie-upstream/go.mod
          cache: true
          cache-dependency-path: magpie-upstream/go.sum
      - name: Verify against Magpie middleware runtime
        run: |
          cp agent-ebpf-filter/integrations/magpie/agent-ebpf-behavior/upstream_runtime_test.go \
            magpie-upstream/internal/middleware/agent_ebpf_external_test.go
          cd magpie-upstream
          # Upstream's headless Docker build uses these flags; default
          # desktop Go compilation requires libfontconfig + other GUI libs.
          AGENT_EBPF_MAGPIE_PLUGIN="$GITHUB_WORKSPACE/agent-ebpf-filter/integrations/magpie/agent-ebpf-behavior" \
            CGO_ENABLED=0 go test -tags nogui ./internal/middleware -run '^TestAgentEBPFExternalMiddleware$' -count=1 -v
