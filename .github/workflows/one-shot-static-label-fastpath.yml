name: one-shot static syscall label fastpath

on:
  push:
    branches:
      - perf/static-syscall-label-fastpath

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/static-syscall-label-fastpath
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply static-label fast path
        run: python3 .github/scripts/one_shot_static_label_fastpath.py
      - name: Assert static labels avoid exit path maps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('backend/ebpf/agent_tracker_syscalls.h').read_text()
          macro = s[s.index('#define DEFINE_SIMPLE_ENTER_HANDLER'):s.index('// Define all simple handlers')]
          if 'exit_path_ctx' in macro or 'exit_path_buf' in macro:
              raise SystemExit('simple syscall macro still touches exit path maps')
          if 'DEFINE_GENERIC_EXIT_HANDLER' in s:
              raise SystemExit('legacy generic exit handler still present')
          static_labels = [
              'Special Resource Interaction (ioctl)', 'chmod', 'chown', 'mknod',
              'process clone', 'process wait4', 'process exit', 'file open',
              'file rename', 'file link', 'file symlink', 'socket create',
              'socket bind', 'socket recvfrom',
          ]
          for label in static_labels:
              if f'__builtin_memcpy(pd->path, "{label}"' in s:
                  raise SystemExit(f'static label still stored in scratch map: {label}')
          if s.count('DEFINE_STATIC_EXIT_HANDLER(') < 14:
              raise SystemExit('expected static exit handlers are missing')
          PY
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto proto/tracker_registration.proto \
            proto/tracker_system.proto proto/tracker_config.proto proto/tracker_shell.proto
      - name: Generate repository eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Capture and audit regression tests
        working-directory: backend
        run: |
          go test ./app/captureprofile -count=1
          go test ./app/events -run 'Test(Kernel|BuildKernel|HTTP|Socket|Audit)' -count=1
          go test ./app/tls -run 'Test.*(API|Fingerprint|HTTP|GRPC)' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Verify generated binding drift
        run: git diff --exit-code -- backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/ebpf/agent_tracker_syscalls.h docs/backend/generic-api-capture.md
          git commit -m 'perf(ebpf): inline static syscall labels on exit'
          git push
