name: Documentation / GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/check-technical-docs.py'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check-technical-docs.py'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation generator
        run: python -m pip install -r docs/requirements.txt
      - name: Validate documentation links
        run: python3 scripts/check-doc-links.py docs
      - name: Validate code anchors and Mermaid inventory
        run: python3 scripts/check-technical-docs.py
      - name: Build static documentation
        run: python3 docs/build_site.py build
      - name: Verify published entrypoints
        run: |
          test -s site/index.html
          test -s site/technical/index/index.html
          test -s site/technical/kernel/index.html
          test -s site/guide/quick-start/index.html
      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
