name: Agent decision training contracts
on:
  pull_request:
    paths:
      - 'scripts/research/decision-training-20261021/**'
      - '.github/workflows/decision-training-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile training entrypoint
        run: python3 -m py_compile scripts/research/decision-training-20261021/*.py
      - name: Run data isolation and low-FPR contract tests
        run: python3 -m unittest discover -s scripts/research/decision-training-20261021 -p 'test_*.py' -v
  gradients:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/research/decision-training-20261021/requirements-objectives.txt
      - name: Install pinned CPU objectives dependency
        run: python -m pip install -r scripts/research/decision-training-20261021/requirements-objectives.txt
      - name: Require actual gradient tests without pretrained assets
        env:
          REQUIRE_TORCH_TESTS: '1'
          OMP_NUM_THREADS: '2'
        run: python -m unittest discover -s scripts/research/decision-training-20261021 -p 'test_training_objectives_torch.py' -v

