name: one-shot split single path context

on:
  push:
    branches:
      - perf/split-single-path-context

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/split-single-path-context
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply split path-context optimization
        run: python3 .github/scripts/one_shot_split_single_path_ctx.py
      - name: Assert path-context routing and cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          common = Path('backend/ebpf/agent_tracker_common.h').read_text()
          tail = Path('backend/ebpf/agent_tracker_tail.h').read_text()
          runtime = Path('backend/app/runtime_ebpf.go').read_text()

          assert 'exit_single_path_ctx SEC(".maps")' in common
          assert '__uint(max_entries, 1024);' in common
          assert 'bpf_map_update_elem(&exit_single_path_ctx, &pid_tgid, pd->path, BPF_ANY);' in common
          assert common.count('bpf_map_update_elem(&exit_single_path_ctx, &pid_tgid, pd->path, BPF_ANY);') == 4
          assert '__builtin_memcpy(e->path, "socket connect", 15);' in common
          connect = common[common.index('tracepoint__syscalls__sys_enter_connect'):common.index('// sys_enter / sys_exit: mkdirat')]
          assert 'exit_path_ctx' not in connect and 'exit_single_path_ctx' not in connect
          assert 'if (tag_id == 0) return 0;' in connect

          assert 'EXIT_PATH_SINGLE' in tail and 'EXIT_PATH_PAIR' in tail
          assert 'bpf_map_delete_elem(&exit_single_path_ctx, &pid_tgid);' in tail
          assert 'bpf_map_delete_elem(&exit_path_ctx, &pid_tgid);' in tail
          for macro in ('SYS_PATH0(name, nr)', 'SYS_PATH1(name, nr)', 'SYS_PATH4(name, nr)'):
              start = tail.index('#define ' + macro)
              segment = tail[start:start + 2200]
              assert 'exit_single_path_ctx' in segment, macro
              assert 'EXIT_PATH_SINGLE' in segment, macro
          for macro in ('SYS_PATH01(name, nr)', 'SYS_PATH13(name, nr)', 'SYS_PATH02(name, nr)'):
              start = tail.index('#define ' + macro)
              segment = tail[start:start + 2400]
              assert 'bpf_map_update_elem(&exit_path_ctx' in segment, macro
              assert 'EXIT_PATH_PAIR' in segment, macro
          assert 'exit_single_path_ctx' in runtime
          PY
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto proto/tracker_registration.proto \
            proto/tracker_system.proto proto/tracker_config.proto proto/tracker_shell.proto
      - name: Generate repository eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Compile runtime with generated map layout
        working-directory: backend
        run: go test ./app -run '^$' -count=1
      - name: Capture and audit regression tests
        working-directory: backend
        run: |
          go test ./app/captureprofile -count=1
          go test ./app/events -run 'Test(Kernel|BuildKernel|HTTP|Socket|Audit)' -count=1
          go test ./app/tls -run 'Test.*(API|Fingerprint|HTTP|GRPC)' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Assert generated map bindings
        run: |
          grep -q 'ExitSinglePathCtx.*ebpf:"exit_single_path_ctx"' backend/ebpf/agenttracker_bpfel.go
          grep -q 'ExitSinglePathCtx.*ebpf:"exit_single_path_ctx"' backend/ebpf/agenttracker_bpfeb.go
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/ebpf/agent_tracker_common.h \
            backend/ebpf/agent_tracker_tail.h \
            backend/ebpf/agenttracker_bpfel.go \
            backend/ebpf/agenttracker_bpfeb.go \
            backend/app/runtime_ebpf.go \
            docs/backend/generic-api-capture.md
          git commit -m 'perf(ebpf): split single-path exit context'
          git push
