name: Paper attribution three-mode live ablation

on:
  push:
    branches: ['research/**']
    paths:
      - '.github/workflows/paper-attribution-ablation.yml'
      - 'backend/app/runtime_ebpf.go'
      - 'backend/app/events/context_event.go'
      - 'backend/app/attribution_cgroup.go'
      - 'scripts/paper-attribution-ablation-ci.sh'
      - 'scripts/attribution-concurrent-workload.py'
      - 'scripts/paper-attribution-reconcile.py'
      - 'scripts/paper-attribution-ablation-summary.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-modes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - name: Build BPF kernel-event backend
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y clang llvm libbpf-dev libelf-dev protobuf-compiler jq
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto \
            proto/tracker_registration.proto proto/tracker_system.proto \
            proto/tracker_config.proto proto/tracker_shell.proto
          (cd backend/ebpf && go generate)
          go build -o "$RUNNER_TEMP/paper-ablation-backend" ./backend
      - name: Run PID-only, lifecycle-only, and combined real Agent cohorts
        shell: bash
        run: bash scripts/paper-attribution-ablation-ci.sh
      - name: Display independent event-denominator report
        if: success()
        run: cat reports/paper-attribution-ablation/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive raw events and failed-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-attribution-three-mode-raw
          path: reports/paper-attribution-ablation/
          if-no-files-found: warn
          retention-days: 30
