name: Public privacy v6 controlled ablation
on:
  push:
    branches: ['research/kernel-http-features-20261018']
    paths: ['scripts/research/decision-training-20261021/public-v6-request.json']
  workflow_dispatch:
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        candidate: [v6_legacy_pair, v6_evidence_pair, v6_legacy_tail, v6_evidence_tail]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/research/deep-optimization-20261018/requirements.txt
      - name: Install pinned CPU environment
        run: python -m pip install -r scripts/research/deep-optimization-20261018/requirements.txt
      - name: Record source and environment
        run: |
          mkdir -p _research_run
          git rev-parse HEAD > _research_run/source_commit.txt
          python -m pip freeze > _research_run/environment.txt
          python -c "import torch; assert torch.__version__ == '2.14.1+cpu'; print(torch.__version__)"
      - name: Verify pinned public assets
        run: python scripts/research/decision-training-20261021/fetch_privacy_assets.py --assets _research_assets | tee _research_run/downloads.log
      - name: Reproduce fixed scenario-disjoint preparation
        run: python scripts/research/deep-optimization-20261018/prepare_public.py --assets _research_assets | tee _research_run/preparation.log
      - name: Train one equal-budget candidate without test evaluation
        timeout-minutes: 35
        run: |
          python scripts/research/decision-training-20261021/train_privacy_v6.py worker \
            --candidate '${{ matrix.candidate }}' --assets _research_assets \
            --out _research_run/candidate | tee _research_run/training.log
      - name: Preserve weights and worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-v6-worker-${{ matrix.candidate }}-${{ github.run_id }}
          path: |
            _research_run/
            _research_assets/agent_privacy_data/manifest.json
            _research_assets/raw/PrivacyAlign_README.md
            _research_assets/base_mini/README.md
          retention-days: 30
          if-no-files-found: warn
  aggregate:
    needs: workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/research/deep-optimization-20261018/requirements.txt
      - name: Install pinned CPU environment
        run: python -m pip install -r scripts/research/deep-optimization-20261018/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: privacy-v6-worker-*
          path: _v6_workers
      - name: Verify pinned public assets
        run: python scripts/research/decision-training-20261021/fetch_privacy_assets.py --assets _research_assets
      - name: Reproduce fixed public preparation
        run: python scripts/research/deep-optimization-20261018/prepare_public.py --assets _research_assets
      - name: Freeze all candidates then evaluate consumed-test regression
        run: |
          mkdir -p _v6_final
          python scripts/research/decision-training-20261021/train_privacy_v6.py aggregate \
            --assets _research_assets --workers _v6_workers --out _v6_final/results \
            | tee _v6_final/aggregation.log
          python -m pip freeze > _v6_final/environment.txt
          git rev-parse HEAD > _v6_final/source_commit.txt
      - name: Preserve controlled comparison and weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-public-v6-${{ github.run_id }}
          path: |
            _v6_final/
            _v6_workers/**/worker.json
            _v6_workers/**/protocol.json
            _v6_workers/**/encoding_audit.json
            _v6_workers/**/calibration_predictions.jsonl
            _research_assets/agent_privacy_data/manifest.json
            _research_assets/raw/PrivacyAlign_README.md
            _research_assets/base_mini/README.md
          retention-days: 30
          if-no-files-found: warn
