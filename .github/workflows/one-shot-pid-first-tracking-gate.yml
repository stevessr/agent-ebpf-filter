name: one-shot PID-first tracking gate

on:
  push:
    branches:
      - perf/pid-first-tracking-gate

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/pid-first-tracking-gate
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply PID-first tracking gate
        run: python3 .github/scripts/one_shot_pid_first_tracking_gate.py
      - name: Format Go source contract
        run: gofmt -w backend/app/runtime_tracking_mode_source_test.go
      - name: Assert PID-first enter-side ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c = Path('backend/ebpf/agent_tracker_common.h').read_text()
          t = Path('backend/ebpf/agent_tracker_tail.h').read_text()
          for helper in ('get_enter_tag_id_nopath', 'get_enter_tag_id_pre_path'):
              start = c.find(f'static __always_inline u32 {helper}')
              end = c.find('\n}\n', start)
              block = c[start:end]
              pid = block.find('get_pid_tag_id(pid)')
              comm = block.find('bpf_get_current_comm')
              if start < 0 or pid < 0 or comm < 0 or pid > comm:
                  raise SystemExit(f'{helper} is not PID-first')
          for fn in ('execve', 'openat', 'mkdirat', 'unlinkat'):
              start = c.find(f'int tracepoint__syscalls__sys_enter_{fn}')
              end = c.find('\n}\n', start)
              block = c[start:end]
              if 'get_enter_tag_id_pre_path' not in block or 'bpf_get_current_comm' in block:
                  raise SystemExit(f'{fn} still performs unconditional enter-side comm read')
          for macro in ('SYS_PATH0','SYS_PATH01','SYS_PATH1','SYS_PATH13','SYS_PATH02','SYS_PATH4'):
              start = t.find(f'#define {macro}(name, nr)')
              end = t.find('\n// ── Macro:', start + 1)
              if end < 0: end = len(t)
              block = t[start:end]
              if 'get_enter_tag_id_pre_path' not in block or 'bpf_get_current_comm' in block:
                  raise SystemExit(f'{macro} still performs unconditional enter-side comm read')
          for macro in ('SYS_NUM','SYS_NUM2'):
              start = t.find(f'#define {macro}(name, nr')
              end = t.find('\n// ', start + 1)
              if end < 0: end = len(t)
              block = t[start:end]
              if 'sys_enter_common_nopath' not in block or 'bpf_get_current_comm' in block:
                  raise SystemExit(f'{macro} bypasses lazy no-path matcher')
          PY
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto proto/tracker_registration.proto \
            proto/tracker_system.proto proto/tracker_config.proto proto/tracker_shell.proto
      - name: Generate repository eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Focused regression tests
        working-directory: backend
        run: |
          go test ./app -run 'Test(TrackingModeFlags|PathRuleFastRejectSourceContract|PIDFirstEnterTrackingSourceContract|TracepointNameFromTag)' -count=1
          go test ./app/observability -count=1
          go test ./app/captureprofile -count=1
          go test ./app/events -run 'Test(Kernel|BuildKernel|HTTP|Socket|Audit)' -count=1
          go test ./app/tls -run 'Test.*(API|Fingerprint|HTTP|GRPC)' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Verify generated bindings stay clean
        run: git diff --exit-code -- backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/ebpf/agent_tracker_common.h backend/ebpf/agent_tracker_tail.h \
            backend/app/runtime_tracking_mode_source_test.go docs/backend/generic-api-capture.md
          git commit -m 'perf(ebpf): check tracked PID before enter-side comm reads'
          git push
