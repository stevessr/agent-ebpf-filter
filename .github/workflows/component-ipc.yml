name: Component IPC security

on:
  pull_request:
    paths:
      - "backend/internal/componentipc/**"
      - "backend/cmd/component-ipc-doctor/**"
      - "backend/cmd/component-engine-worker/**"
      - "backend/internal/componentwire/**"
      - "backend/internal/componentproc/**"
      - "docs/architecture/component-ipc.md"
      - "Makefile"
      - ".github/workflows/component-ipc.yml"
  push:
    paths:
      - "backend/internal/componentipc/**"
      - "backend/cmd/component-ipc-doctor/**"
      - "docs/architecture/component-ipc.md"
      - "Makefile"
      - ".github/workflows/component-ipc.yml"

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Security protocol and bounded queue race tests
        working-directory: backend
        run: go test -race -count=1 ./internal/componentipc
      - name: Rootless IPC doctor self-test and JSON smoke
        working-directory: backend
        run: |
          go test -race -count=1 ./cmd/component-ipc-doctor
          go run ./cmd/component-ipc-doctor --json
      - name: Rootless split Engine process and canonical event schema
        working-directory: backend
        run: go test -race -count=1 ./internal/componentwire ./internal/componentproc
      - name: Static vet
        working-directory: backend
        run: go vet ./internal/componentipc ./cmd/component-ipc-doctor ./internal/componentwire ./internal/componentproc ./cmd/component-engine-worker
      - name: Go formatting
        run: |
          files="$(gofmt -l backend/internal/componentipc/*.go backend/cmd/component-ipc-doctor/*.go backend/internal/componentwire/*.go backend/internal/componentproc/*.go backend/cmd/component-engine-worker/*.go)"
          if [ -n "$files" ]; then
            echo "$files"
            gofmt -d backend/internal/componentipc/*.go backend/cmd/component-ipc-doctor/*.go backend/internal/componentwire/*.go backend/internal/componentproc/*.go backend/cmd/component-engine-worker/*.go
            exit 1
          fi
