name: one-shot socket capture visual config

on:
  push:
    branches:
      - feat/generic-api-capture-kernel-provenance

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/generic-api-capture-kernel-provenance
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply socket visual config patch
        run: python3 .github/scripts/one_shot_socket_capture_visual_config.py
      - name: Go fmt
        run: |
          gofmt -w backend/app/captureprofile_control.go backend/app/captureprofile_control_test.go backend/app/jobs_background.go backend/app/routes.go
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto \
            proto/tracker_events.proto \
            proto/tracker_registration.proto \
            proto/tracker_system.proto \
            proto/tracker_config.proto \
            proto/tracker_shell.proto
      - name: Generate eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Backend capture profile tests
        working-directory: backend
        run: |
          go test ./app/captureprofile -count=1
          go test ./app -run 'TestCaptureProfile' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Frontend install
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Frontend typecheck
        working-directory: frontend
        run: bunx vue-tsc -b --pretty false
      - name: Frontend build
        working-directory: frontend
        run: bun run build
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/captureprofile_control.go backend/app/captureprofile_control_test.go backend/app/jobs_background.go backend/app/routes.go frontend/src/views/network/SocketCaptureProfiles.vue frontend/src/views/network/NetworkFlow.vue docs/backend/generic-api-capture.md
          git commit -m 'feat(capture): add socket-view visual profile control plane'
          git push
