name: one-shot generic API capture

on:
  push:
    branches:
      - feat/generic-api-capture-kernel-provenance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/generic-api-capture-kernel-provenance
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply generic capture patch
        run: |
          python3 .github/scripts/one_shot_generic_api_capture.py
          python3 .github/scripts/one_shot_generic_api_capture_fixups.py
      - name: Go fmt
        run: |
          gofmt -w \
            backend/app/captureprofile/profile.go \
            backend/app/captureprofile/profile_test.go \
            backend/app/tls/api_fingerprint.go \
            backend/app/tls/api_fingerprint_test.go \
            backend/app/tls/capturetypestls.go \
            backend/app/tls/agentstreamlooptls.go \
            backend/app/events/events_network.go \
            backend/app/events/kernel_socket_http_test.go \
            backend/app/events/envelope_event.go \
            backend/app/runtime_ebpf.go \
            backend/core/types.go
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto \
            proto/tracker_events.proto \
            proto/tracker_registration.proto \
            proto/tracker_system.proto \
            proto/tracker_config.proto \
            proto/tracker_shell.proto
      - name: Generate eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Generic capture focused tests
        working-directory: backend
        run: |
          go test ./app/captureprofile ./app/events ./app/tls \
            -run 'Test(Builtin|RequestPath|ParseHTTP1|RegistryReplace|BuildKernelSocketHTTP|AnnotateTLSAPIFingerprint)' -count=1
          go test ./app -run 'TestApplyKernelAuditGeneration' -count=1
          go test ./core -run 'TestBpfEventAuditABIGuard' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Show generated tracker binding delta
        run: git diff -- backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go
      - name: Commit functional patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend proto frontend docs
          git commit -m 'feat(capture): generalize API fingerprints with kernel socket provenance'
          git push
