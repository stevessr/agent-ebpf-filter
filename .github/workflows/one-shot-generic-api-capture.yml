name: one-shot generic API capture hardening

on:
  push:
    branches:
      - feat/generic-api-capture-kernel-provenance

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/generic-api-capture-kernel-provenance
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply privacy and provenance hardening
        run: |
          python3 .github/scripts/one_shot_generic_api_capture_hardening.py
          python3 .github/scripts/one_shot_generic_api_capture_verifier_fix.py
      - name: Go fmt
        run: gofmt -w backend/app/runtime_ebpf.go backend/app/tls/api_fingerprint.go
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto \
            proto/tracker_events.proto \
            proto/tracker_registration.proto \
            proto/tracker_system.proto \
            proto/tracker_config.proto \
            proto/tracker_shell.proto
      - name: Generate eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Generic capture hardening tests
        working-directory: backend
        run: |
          go test ./app/captureprofile ./app/events ./app/tls -run 'Test(Builtin|RequestPath|ParseHTTP1|RegistryReplace|BuildKernelSocketHTTP|AnnotateTLSAPIFingerprint)' -count=1
          go test ./app -run 'Test(ApplyKernelAuditGeneration|ClearSocketFDProvenance)' -count=1
          go test ./core -run 'TestBpfEventAuditABIGuard' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend docs
          git commit -m 'fix(capture): harden kernel URL privacy and socket provenance'
          git push
