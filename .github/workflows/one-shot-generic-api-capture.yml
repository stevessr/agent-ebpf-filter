name: one-shot generic API capture phase2b

on:
  push:
    branches:
      - feat/generic-api-capture-kernel-provenance

permissions:
  contents: write

jobs:
  phase2b:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/generic-api-capture-kernel-provenance
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev libelf-dev protobuf-compiler
      - name: Apply scatter gather capture patch
        run: python3 .github/scripts/one_shot_generic_api_capture_phase2b_iovec.py
      - name: Go fmt
        run: gofmt -w backend/app/events/kernel_socket_http_test.go
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto \
            proto/tracker_events.proto \
            proto/tracker_registration.proto \
            proto/tracker_system.proto \
            proto/tracker_config.proto \
            proto/tracker_shell.proto
      - name: Generate eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Scatter gather focused tests
        working-directory: backend
        run: |
          go test ./app/events -run 'TestBuildKernelSocketHTTP' -count=1
          go test ./core -run 'TestBpfEventAuditABIGuard' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Show generated tracker binding delta
        run: git diff -- backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go
      - name: Commit scatter gather capture
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend docs
          git commit -m 'feat(capture): cover scatter gather socket plaintext paths'
          git push
