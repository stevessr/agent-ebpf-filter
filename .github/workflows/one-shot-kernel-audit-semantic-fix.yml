name: one-shot kernel audit semantic fix

on:
  push:
    branches:
      - feat/kernel-audit-loss-provenance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/kernel-audit-loss-provenance
      - name: Apply semantic fixes
        run: |
          python3 .github/scripts/one_shot_kernel_audit_semantic_fix.py
          gofmt -w backend/app/runtime_ebpf.go backend/app/runtime_ebpf_audit_test.go backend/app/observability/metrics_collector.go
          git diff --check
      - name: Commit functional files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/runtime_ebpf.go backend/app/runtime_ebpf_audit_test.go backend/app/observability/metrics_collector.go
          git commit -m 'fix(audit): preserve sequence across generations'
          git push
