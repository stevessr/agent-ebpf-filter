name: one-shot capture profile perf

on:
  push:
    branches:
      - perf/capture-profile-index-fast-http1

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/capture-profile-index-fast-http1
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply capture matcher performance patch
        run: python3 .github/scripts/one_shot_capture_profile_perf.py
      - name: Format Go sources
        run: |
          gofmt -w backend/app/captureprofile/profile.go backend/app/captureprofile/profile_index.go backend/app/captureprofile/profile_test.go backend/app/captureprofile/profile_bench_test.go backend/app/captureprofile_control.go backend/app/tls/api_fingerprint.go backend/app/events/events_network.go backend/core/types.go
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto \
            proto/tracker_events.proto \
            proto/tracker_registration.proto \
            proto/tracker_system.proto \
            proto/tracker_config.proto \
            proto/tracker_shell.proto
      - name: Generate repository eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Capture profile tests
        working-directory: backend
        run: go test ./app/captureprofile -count=1
      - name: Event and TLS focused tests
        working-directory: backend
        run: |
          go test ./app/events -run 'Test(Kernel|BuildKernel|HTTP|Socket)' -count=1
          go test ./app/tls -run 'Test.*(API|Fingerprint|HTTP|GRPC)' -count=1
      - name: App control-plane tests
        working-directory: backend
        run: go test ./app -run 'TestCaptureProfile' -count=1
      - name: Matcher benchmark
        working-directory: backend
        run: go test ./app/captureprofile -run '^$' -bench BenchmarkRegistryMatchIndexed512 -benchmem -count=3
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Frontend install
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Frontend typecheck and build
        working-directory: frontend
        run: bun run build
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/app/captureprofile/profile.go \
            backend/app/captureprofile/profile_index.go \
            backend/app/captureprofile/profile_test.go \
            backend/app/captureprofile/profile_bench_test.go \
            backend/app/captureprofile_control.go \
            backend/app/tls/api_fingerprint.go \
            backend/app/events/events_network.go \
            backend/core/types.go \
            backend/ebpf/agent_tracker_common.h \
            backend/ebpf/agent_tracker_syscalls.h \
            backend/ebpf/agenttracker_bpfel.go \
            backend/ebpf/agenttracker_bpfeb.go \
            frontend/src/views/network/SocketCaptureProfiles.vue \
            docs/backend/generic-api-capture.md
          git commit -m 'perf(capture): index profiles and fuse HTTP1 classification'
          git push
