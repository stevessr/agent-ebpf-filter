name: Rust variant

concurrency:
  group: rust-variant-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [rust-variant]
  pull_request:
    branches: [rust-variant]

jobs:
  userspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace


  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src,rustfmt,clippy
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Format
        working-directory: webui
        run: cargo +nightly fmt --all --check
      - name: Build GPUI Web
        working-directory: webui
        run: trunk build --release
      - name: Verify deployable assets
        run: |
          test -f webui/dist/index.html
          find webui/dist -maxdepth 1 -type f -name '*.wasm' -print -quit | grep -q .
          find webui/dist -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .


  ebpf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src,rustfmt
      - name: Install bpf-linker
        uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker
      - name: Format
        working-directory: rust/ebpf/agent-ebpf
        run: cargo +nightly fmt --all --check
      - name: Build Aya collector
        working-directory: rust/ebpf/agent-ebpf
        run: cargo +nightly build --release --target bpfel-unknown-none -Z build-std=core
