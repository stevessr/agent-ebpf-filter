name: one-shot compact exit context

on:
  push:
    branches:
      - perf/compact-exit-context

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/compact-exit-context
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply compact exit correlation
        run: python3 .github/scripts/one_shot_compact_exit_ctx.py
      - name: Assert compact/full routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c = Path('backend/ebpf/agent_tracker_common.h').read_text()
          t = Path('backend/ebpf/agent_tracker_tail.h').read_text()
          s = Path('backend/ebpf/agent_tracker_syscalls.h').read_text()
          r = Path('backend/app/runtime_ebpf.go').read_text()
          if 'sizeof(struct exit_compact_meta) == 32' not in c or 'exit_compact_ctx SEC(".maps")' not in c:
              raise SystemExit('compact exit ABI/map missing')
          if 'struct exit_compact_meta meta' not in t or 'store_exit_compact_meta' not in t or 'consume_exit_compact_meta' not in t:
              raise SystemExit('generic syscall tail not using compact correlation')
          for fn in ('execve','openat','mkdirat','unlinkat'):
              for direction in ('enter','exit'):
                  start = c.index(f'int tracepoint__syscalls__sys_{direction}_{fn}')
                  end = c.index('\n}\n', start)
                  block = c[start:end]
                  if 'exit_compact_meta' not in block:
                      raise SystemExit(f'{fn} {direction} not compact')
          for name in ('ioctl','chmod','chown','mknod','clone','wait4','exit_group','open','rename','link','symlink'):
              if f'DEFINE_COMPACT_STATIC_EXIT_HANDLER({name},' not in s:
                  raise SystemExit(f'{name} static exit not compact')
          for fn in ('socket','close'):
              start = s.index(f'int tracepoint__syscalls__sys_enter_{fn}')
              end = s.index('\n}\n', start)
              if 'exit_compact_meta' not in s[start:end]:
                  raise SystemExit(f'{fn} enter not compact')
          dup = s[s.index('#define DEFINE_DUP_HANDLER'):s.index('DEFINE_DUP_HANDLER(dup)')]
          if 'exit_compact_meta' not in dup or 'exit_meta meta' in dup:
              raise SystemExit('dup lineage not compact')
          # Endpoint/pointer-heavy paths must stay on the full map.
          for fn in ('bind','sendto','recvfrom','accept','read','write','sendmsg','recvmsg'):
              if f'sys_enter_{fn}' in s:
                  start = s.index(f'int tracepoint__syscalls__sys_enter_{fn}')
                  end = s.index('\n}\n', start)
                  block = s[start:end]
                  if fn != 'accept' and 'struct exit_meta meta' not in block:
                      raise SystemExit(f'{fn} unexpectedly left full exit context')
          if '"exit_compact_ctx"' not in r or 'objs.ExitCompactCtx' not in r:
              raise SystemExit('runtime pin/load list missing compact map')
          PY
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto proto/tracker_registration.proto \
            proto/tracker_system.proto proto/tracker_config.proto proto/tracker_shell.proto
      - name: Generate repository eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Compile runtime with generated map layout
        working-directory: backend
        run: go test ./app -run '^TestTracepointNameFromTag$' -count=1
      - name: Capture and audit regression tests
        working-directory: backend
        run: |
          go test ./app/captureprofile -count=1
          go test ./app/events -run 'Test(Kernel|BuildKernel|HTTP|Socket|Audit)' -count=1
          go test ./app/tls -run 'Test.*(API|Fingerprint|HTTP|GRPC)' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Assert generated map bindings
        run: |
          grep -q 'ExitCompactCtx.*ebpf:"exit_compact_ctx"' backend/ebpf/agenttracker_bpfel.go
          grep -q 'ExitCompactCtx.*ebpf:"exit_compact_ctx"' backend/ebpf/agenttracker_bpfeb.go
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/runtime_ebpf.go backend/ebpf/agent_tracker_common.h backend/ebpf/agent_tracker_tail.h \
            backend/ebpf/agent_tracker_syscalls.h backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go \
            docs/backend/generic-api-capture.md
          git commit -m 'perf(ebpf): add compact exit correlation context'
          git push
