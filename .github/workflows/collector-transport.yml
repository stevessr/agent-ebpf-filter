name: Collector transport boundary

on:
  pull_request:
    paths:
      - "backend/internal/collectorstream/**"
      - "backend/internal/collectorcodec/**"
      - "backend/internal/taskgroup/**"
      - "backend/internal/eventqueue/**"
      - "backend/app/jobs_background.go"
      - "backend/app/broadcast_queue*.go"
      - "backend/app/kernel_event_reader_lifecycle_test.go"
      - ".github/workflows/collector-transport.yml"
  push:
    paths:
      - "backend/internal/collectorstream/**"
      - "backend/internal/collectorcodec/**"
      - "backend/internal/taskgroup/**"
      - "backend/internal/eventqueue/**"
      - "backend/app/jobs_background.go"
      - "backend/app/broadcast_queue*.go"
      - "backend/app/kernel_event_reader_lifecycle_test.go"
      - ".github/workflows/collector-transport.yml"

permissions:
  contents: read

jobs:
  transport-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test independent transport components with race detector
        working-directory: backend
        run: go test -race ./internal/collectorstream ./internal/collectorcodec ./internal/eventqueue ./internal/taskgroup -count=1
      - name: Verify Go formatting
        run: |
          files="$(gofmt -l backend/internal/collectorstream/*.go backend/internal/collectorcodec/*.go backend/internal/eventqueue/*.go backend/internal/taskgroup/*.go backend/app/jobs_background.go backend/app/broadcast_queue.go backend/app/broadcast_queue_test.go)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            gofmt -d backend/internal/collectorstream/*.go backend/internal/collectorcodec/*.go backend/internal/eventqueue/*.go backend/internal/taskgroup/*.go backend/app/jobs_background.go backend/app/broadcast_queue.go backend/app/broadcast_queue_test.go
            exit 1
          fi

  app-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install code generation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - name: Generate embedded backend sources
        run: ./scripts/renew-desktop.sh prepare
      - name: Test existing queue metrics and kernel reader lifecycle
        working-directory: backend
        run: go test ./app -run 'TestEnqueueBroadcastEvent|TestKernelEventReader|TestDecodeBPFEventRecord' -count=1
