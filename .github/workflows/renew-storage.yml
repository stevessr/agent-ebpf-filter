name: Renew storage

on:
  pull_request:
    paths:
      - "backend/app/runtime_event_store_pebble.go"
      - "backend/app/runtime_event_store_pebble_test.go"
      - "backend/app/statepersistenceruntime.go"
      - "backend/app/stateenvruntime.go"
      - "backend/app/stateenvruntime_test.go"
      - "backend/app/platform/platform.go"
      - "backend/app/main.go"
      - "backend/core/state_types.go"
      - "backend/app/ws_api.go"
      - "backend/app/event_path_filter.go"
      - "backend/app/event_path_filter_test.go"
      - "backend/app/system_noise_filter_test.go"
      - "backend/app/handlers/**"
      - "backend/go.mod"
      - "backend/go.sum"
      - ".github/workflows/renew-storage.yml"
  push:
    paths:
      - "backend/app/runtime_event_store_pebble.go"
      - "backend/app/runtime_event_store_pebble_test.go"
      - "backend/app/statepersistenceruntime.go"
      - "backend/app/stateenvruntime.go"
      - "backend/app/stateenvruntime_test.go"
      - "backend/app/platform/platform.go"
      - "backend/app/main.go"
      - "backend/core/state_types.go"
      - "backend/app/ws_api.go"
      - "backend/app/event_path_filter.go"
      - "backend/app/event_path_filter_test.go"
      - "backend/app/system_noise_filter_test.go"
      - "backend/app/handlers/**"
      - "backend/go.mod"
      - "backend/go.sum"
      - ".github/workflows/renew-storage.yml"

permissions:
  contents: read

concurrency:
  group: renew-storage-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install generation dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev libelf-dev protobuf-compiler
      - name: Download Go dependencies
        working-directory: backend
        run: go mod download
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto \
            proto/tracker_events.proto \
            proto/tracker_registration.proto \
            proto/tracker_system.proto \
            proto/tracker_config.proto \
            proto/tracker_shell.proto
      - name: Generate eBPF objects
        working-directory: backend/ebpf
        run: go generate
      - name: Test Renew event database
        working-directory: backend
        run: go test ./app -run 'Test(RuntimeEventStore|EventTypeDisabledBitset|SeedRuntimeSettingsFromEnv|.*Ignored.*|PathMatchesIgnoredPrefixUsesPathBoundary|ShouldIgnoreEventPathKeepsAttentionEvents|RoutineSystemNoise)' -count=1
      - name: Verify module lockfile
        working-directory: backend
        run: go mod verify
