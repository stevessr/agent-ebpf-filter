name: one-shot path rule fast reject

on:
  push:
    branches:
      - perf/path-rule-fast-reject

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/path-rule-fast-reject
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply path rule fast reject
        run: python3 .github/scripts/one_shot_path_rule_fast_reject.py
      - name: Format Go sources
        run: |
          gofmt -w backend/core/types.go backend/app/runtime_ebpf.go backend/app/handlersbridge.go \
            backend/app/server_mcp.go backend/app/runtime_tracking_mode_test.go
      - name: Assert pre-path fast reject and safe migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c = Path('backend/ebpf/agent_tracker_common.h').read_text()
          t = Path('backend/ebpf/agent_tracker_tail.h').read_text()
          r = Path('backend/app/runtime_ebpf.go').read_text()
          h = Path('backend/app/handlersbridge.go').read_text()
          m = Path('backend/app/server_mcp.go').read_text()
          if 'tracking_mode SEC(".maps")' not in c:
              raise SystemExit('tracking_mode map missing')
          if 'return flags ? *flags : TRACKING_MODE_PATH_ANY;' not in c:
              raise SystemExit('tracking mode is not fail-open')
          if 'get_tag_id_pre_path' not in c or 'get_path_tag_id' not in c:
              raise SystemExit('split path matching helpers missing')
          for fn in ('execve', 'openat', 'mkdirat', 'unlinkat'):
              start = c.find(f'int tracepoint__syscalls__sys_enter_{fn}')
              end = c.find('\n}\n', start)
              block = c[start:end]
              gate = block.find('TRACKING_MODE_PATH_ANY')
              probe = block.find('bpf_probe_read_user_str')
              if start < 0 or gate < 0 or probe < 0 or gate > probe:
                  raise SystemExit(f'{fn} does not reject before user path probe')
          for macro in ('SYS_PATH0','SYS_PATH01','SYS_PATH1','SYS_PATH13','SYS_PATH02','SYS_PATH4'):
              start = t.find(f'#define {macro}(name, nr)')
              if start < 0:
                  raise SystemExit(f'{macro} missing')
              end = t.find('\n// ── Macro:', start + 1)
              if end < 0: end = len(t)
              block = t[start:end]
              gate = block.find('TRACKING_MODE_PATH_ANY')
              probe = block.find('bpf_probe_read_user_str')
              if gate < 0 or probe < 0 or gate > probe:
                  raise SystemExit(f'{macro} does not reject before user path probe')
          for needle in ('"tracking_mode"', 'syncTrackingModeMap(objs.TrackingMode', 'extractTrackedDataBestEffort()', 'restoreTrackedDataToMaps(', 'syncTrackingModeFlags(&loaded)'):
              if needle not in r:
                  raise SystemExit(f'runtime missing {needle}')
          attach = r.find('if err := pinLinks(&objs)')
          restore = r.find('restoreTrackedDataToMaps(')
          sync = r.find('syncTrackingModeMap(objs.TrackingMode', restore)
          if restore < 0 or sync < restore or attach < sync:
              raise SystemExit('fresh bootstrap attach happens before restore/mode sync')
          for method in ('TrackedPathsPut','TrackedPathsDelete','TrackedPrefixesPut','TrackedPrefixesDelete'):
              pos = h.find(f' {method}(')
              block = h[pos:h.find('\n}\n', pos)]
              if pos < 0 or 'syncTrackingModeFlags(a.set)' not in block:
                  raise SystemExit(f'{method} does not sync tracking mode')
          if 'syncTrackingModeFlags(&trackerMaps)' not in m:
              raise SystemExit('MCP path mutation bypasses tracking mode sync')
          PY
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto proto/tracker_registration.proto \
            proto/tracker_system.proto proto/tracker_config.proto proto/tracker_shell.proto
      - name: Generate repository eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Focused regression tests
        working-directory: backend
        run: |
          go test ./app -run 'Test(TrackingModeFlags|TracepointNameFromTag)' -count=1
          go test ./app/observability -count=1
          go test ./app/captureprofile -count=1
          go test ./app/events -run 'Test(Kernel|BuildKernel|HTTP|Socket|Audit)' -count=1
          go test ./app/tls -run 'Test.*(API|Fingerprint|HTTP|GRPC)' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Assert generated tracking mode binding
        run: |
          grep -q 'TrackingMode.*ebpf:"tracking_mode"' backend/ebpf/agenttracker_bpfel.go
          grep -q 'TrackingMode.*ebpf:"tracking_mode"' backend/ebpf/agenttracker_bpfeb.go
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/core/types.go backend/app/runtime_ebpf.go backend/app/handlersbridge.go \
            backend/app/server_mcp.go backend/app/runtime_tracking_mode_test.go \
            backend/ebpf/agent_tracker_common.h backend/ebpf/agent_tracker_tail.h \
            backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go \
            docs/backend/generic-api-capture.md
          git commit -m 'perf(ebpf): reject path probes when no path rules exist'
          git push
