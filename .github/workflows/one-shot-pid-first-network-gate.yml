name: one-shot PID-first network enter gate

on:
  push:
    branches:
      - perf/pid-first-network-enter-gate

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/pid-first-network-enter-gate
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply PID-first network enter gate
        run: python3 .github/scripts/one_shot_pid_first_network_gate.py
      - name: Format source contract test
        run: gofmt -w backend/app/runtime_tracking_mode_source_test.go
      - name: Assert explicit network handlers are PID-first
        run: |
          python3 - <<'PY'
          from pathlib import Path
          common = Path('backend/ebpf/agent_tracker_common.h').read_text()
          sys = Path('backend/ebpf/agent_tracker_syscalls.h').read_text()
          def check(src, name):
              marker = f'int tracepoint__syscalls__sys_enter_{name}(struct trace_event_raw_sys_enter *ctx) {{'
              start = src.find(marker)
              end = src.find('\n}\n', start)
              block = src[start:end]
              if start < 0 or 'get_enter_tag_id_nopath' not in block or 'bpf_get_current_comm' in block:
                  raise SystemExit(f'{name} is not using lazy PID-first matching')
          check(common, 'connect')
          for name in ('socket','bind','sendto','recvfrom','close','read','write','writev','readv','sendmsg','recvmsg'):
              check(sys, name)
          PY
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto proto/tracker_registration.proto \
            proto/tracker_system.proto proto/tracker_config.proto proto/tracker_shell.proto
      - name: Generate repository eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Focused regression tests
        working-directory: backend
        run: |
          go test ./app -run 'Test(TrackingModeFlags|PathRuleFastRejectSourceContract|PIDFirstEnterTrackingSourceContract|PIDFirstNetworkEnterSourceContract|TracepointNameFromTag)' -count=1
          go test ./app/observability -count=1
          go test ./app/captureprofile -count=1
          go test ./app/events -run 'Test(Kernel|BuildKernel|HTTP|Socket|Audit)' -count=1
          go test ./app/tls -run 'Test.*(API|Fingerprint|HTTP|GRPC)' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Verify generated bindings stay clean
        run: git diff --exit-code -- backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/ebpf/agent_tracker_common.h backend/ebpf/agent_tracker_syscalls.h \
            backend/app/runtime_tracking_mode_source_test.go docs/backend/generic-api-capture.md
          git commit -m 'perf(ebpf): make explicit network enters PID-first'
          git push
