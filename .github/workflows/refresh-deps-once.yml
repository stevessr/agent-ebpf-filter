name: One-shot dependency refresh (review branch)

on:
  push:
    branches:
      - chore/dependency-refresh-20261015
    paths:
      - ".github/workflows/refresh-deps-once.yml"

permissions:
  contents: read

jobs:
  resolve-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: |
            backend/go.sum
            desktop/renew/go.sum
            wrapper/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - uses: astral-sh/setup-uv@v6
      - name: Install protobuf and eBPF build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - name: Generate missing backend protobuf and BPF sources
        run: ./scripts/renew-desktop.sh prepare
      - name: Refresh Go modules (patch-only, except latest stable MyGo)
        shell: bash
        run: |
          set -euo pipefail
          (
            cd desktop/renew
            go get github.com/egoist/mygo@latest
            go get -u=patch ./...
            go mod tidy
          )
          for module in backend wrapper tools/agent-tui tools/dev-env-tui; do
            (
              cd "$module"
              go get -u=patch ./...
              go mod tidy
            )
          done
          go work sync
          for module in backend desktop/renew wrapper tools/agent-tui tools/dev-env-tui; do
            (cd "$module" && go mod tidy && go mod tidy -diff)
          done
          grep -qx 'go 1.27.1' <(head -n 1 go.work)
      - name: Refresh Bun dependencies within declared ranges
        shell: bash
        run: |
          set -euo pipefail
          for dir in . frontend tools/bpf-ts; do
            (cd "$dir" && bun update && bun install --frozen-lockfile)
          done
      - name: Refresh Python adapter lockfile
        working-directory: adapters/python
        run: uv lock --upgrade && uv lock --check
      - name: Validate browser builds and desktop Go package tests
        shell: bash
        run: |
          set -euo pipefail
          bun run docs:build
          (cd frontend && bun run build)
          (cd desktop/renew && go test ./...)
          (cd wrapper && go test ./...)
      - name: Upload candidate manifests (no write token used with new dependencies)
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-dependency-candidates
          if-no-files-found: error
          retention-days: 2
          path: |
            go.work
            go.work.sum
            backend/go.mod
            backend/go.sum
            desktop/renew/go.mod
            desktop/renew/go.sum
            tools/agent-tui/go.mod
            tools/agent-tui/go.sum
            tools/dev-env-tui/go.mod
            tools/dev-env-tui/go.sum
            wrapper/go.mod
            wrapper/go.sum
            package.json
            bun.lock
            frontend/package.json
            frontend/bun.lock
            tools/bpf-ts/package.json
            tools/bpf-ts/bun.lock
            adapters/python/pyproject.toml
            adapters/python/uv.lock

  publish-reviewed-candidates:
    needs: resolve-and-validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-dependency-candidates
          path: .
      - name: Commit lockfile-consistent updates only
        shell: bash
        run: |
          set -euo pipefail
          git add -- go.work go.work.sum backend/go.mod backend/go.sum \
            desktop/renew/go.mod desktop/renew/go.sum \
            tools/agent-tui/go.mod tools/agent-tui/go.sum \
            tools/dev-env-tui/go.mod tools/dev-env-tui/go.sum \
            wrapper/go.mod wrapper/go.sum \
            package.json bun.lock frontend/package.json frontend/bun.lock \
            tools/bpf-ts/package.json tools/bpf-ts/bun.lock \
            adapters/python/pyproject.toml adapters/python/uv.lock
          if git diff --cached --quiet; then
            echo "No dependency updates available."
            exit 0
          fi
          git rm -- .github/workflows/refresh-deps-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(deps): refresh Go, Bun, and Python lockfiles"
          git push origin HEAD:chore/dependency-refresh-20261015
