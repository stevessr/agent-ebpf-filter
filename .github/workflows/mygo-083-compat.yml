name: MyGo v0.8.3 dependency compatibility evaluation

on:
  push:
    branches:
      - feat/ml-curated-corpus-cross-source-20261103
    paths:
      - .github/workflows/mygo-083-compat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            desktop/renew/go.sum
            backend/go.sum
      - name: Install native backend compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - name: Generate embedded backend sources
        run: ./scripts/renew-desktop.sh prepare
      - name: Resolve v0.8.3 without repository writes
        working-directory: desktop/renew
        run: |
          set -euo pipefail
          go get github.com/egoist/mygo@v0.8.3
          go mod tidy
          printf '\nBEGIN-RENEW-GO-MOD\n'
          cat go.mod
          printf 'END-RENEW-GO-MOD\n'
          printf 'BEGIN-RENEW-GO-SUM\n'
          cat go.sum
          printf 'END-RENEW-GO-SUM\n'
      - name: Compile/test desktop compatibility
        working-directory: desktop/renew
        run: |
          go test ./...
          go build ./...
          go tool mygo vet .
