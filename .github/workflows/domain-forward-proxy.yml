name: Domain forward proxy

on:
  pull_request:
    paths:
      - "backend/internal/domainforwardproxy/**"
      - "backend/codex/capture/handlers/**"
      - "backend/app/forwardproxydomain*.go"
      - "backend/app/types.go"
      - "backend/app/tls/capturesinkcodex.go"
      - "backend/app/tls/capturetypestls.go"
      - "backend/app/tls/agentstreamlooptls.go"
      - "backend/app/handlers/agentsight_conversion.go"
      - "backend/core/network_types.go"
      - "frontend/src/components/config/RuntimeTab/RuntimeNetworkExportSection.vue"
      - "frontend/src/composables/config/runtimeSettings.ts"
      - "frontend/src/types/config/domain-forward.ts"
      - "frontend/src/utils/agentsight/normalization.ts"
      - "frontend/src/composables/monitor/useProcessObserver.ts"
      - "frontend/src/components/agentsight/AgentSightEventDetails.vue"
      - "frontend/src/components/monitor/observer/AgentContextPanel.vue"
      - "frontend/src/components/monitor/observer/agentContextParsing.ts"
      - "frontend/tests/agent-context-parsing.test.ts"
      - ".github/workflows/domain-forward-proxy.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install integration build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto \
            proto/tracker_events.proto \
            proto/tracker_registration.proto \
            proto/tracker_system.proto \
            proto/tracker_config.proto \
            proto/tracker_shell.proto
      - name: Generate eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Proxy and capture unit tests
        working-directory: backend
        run: |
          go test ./internal/domainforwardproxy -count=1
          go test ./codex/capture/handlers -count=1
          go test ./app -run 'TestDomainForwardProxy|TestNormalizeDomainForwardProxy' -count=1
      - name: Rewrite kernel benchmark smoke
        working-directory: backend
        run: |
          go test ./internal/domainforwardproxy \
            -run '^$' \
            -bench '^Benchmark(RewriteKernelModel(NoMatch|Match|Match200Rules)|NativeInferenceJSON)$' \
            -benchtime=100x
      - name: Verify Go formatting
        run: |
          targets=(
            backend/internal/domainforwardproxy/*.go
            backend/codex/capture/handlers/*.go
            backend/app/forwardproxydomain.go
            backend/app/forwardproxydomain_test.go
            backend/app/types.go
            backend/app/tls/capturesinkcodex.go
            backend/app/tls/capturetypestls.go
            backend/app/tls/agentstreamlooptls.go
            backend/app/handlers/agentsight_conversion.go
            backend/core/network_types.go
          )
          files="$(gofmt -l "${targets[@]}")"
          test -z "$files" || {
            echo "$files"
            gofmt -d "${targets[@]}"
            exit 1
          }

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Agent context parser tests
        run: bun test tests/agent-context-parsing.test.ts
      - name: Typecheck and build
        run: bun run build
