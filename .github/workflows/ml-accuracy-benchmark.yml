name: ML fixed-seed candidate accuracy benchmark

on:
  push:
    branches:
      - feat/ml-curated-corpus-cross-source-20261103
    paths:
      - .github/workflows/ml-accuracy-benchmark.yml
      - backend/app/decision_training*.go
      - backend/app/ml/**
      - backend/cmd/ml-train/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            backend/go.sum
      - name: Install backend compilation prerequisites
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Generate protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto \
            proto/tracker_registration.proto proto/tracker_system.proto \
            proto/tracker_config.proto proto/tracker_shell.proto
      - name: Generate eBPF bindings
        working-directory: backend/ebpf
        run: |
          go generate
          go generate gen_tls.go
          go generate gen_cgroup.go
          go generate gen_lsm.go
      - name: Compare candidate configurations on identical grouped holdout
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum ../research/curated/ai-reviewed-bash-actions.jsonl | cut -d' ' -f1)"
          mkdir -p artifacts/accuracy-benchmark
          for spec in 'baseline:72:14:3' 'shallow:48:10:2' 'sensitive:72:14:1' 'wide:96:16:2' 'conservative:96:12:4'; do
            IFS=: read -r name trees depth leaf <<< "$spec"
            echo "::group::candidate=$name trees=$trees depth=$depth leaf=$leaf"
            go run ./cmd/ml-train \
              --dataset-file ../research/curated/ai-reviewed-bash-actions.jsonl \
              --dataset-sha256 "$digest" \
              --dataset-license CC-BY-SA-4.0 \
              --seed 20261108 \
              --num-trees "$trees" --max-depth "$depth" \
              --min-samples-leaf "$leaf" \
              --output "artifacts/accuracy-benchmark/$name.bin"
            echo '::endgroup::'
          done
          python3 - <<'PY'
          import glob
          import json

          records = []
          for path in sorted(glob.glob('artifacts/accuracy-benchmark/*.manifest.json')):
              with open(path, encoding='utf-8') as stream:
                  obj = json.load(stream)
              assert obj['hyperparameters']['seed'] == 20261108
              assert obj['samples'] == 99
              records.append((
                  path.rsplit('/', 1)[-1].split('.', 1)[0],
                  obj['validationAccuracy'],
                  obj['validationBlockRecall'],
                  obj['validationBlockPrecision'],
                  obj['validationBenignFalsePositiveRate'],
                  obj['validationMacroF1'],
                  obj['validationSamples'],
              ))
          print('MODEL | accuracy | BLOCK recall | BLOCK precision | benign FPR | macro F1 | validation n')
          for name, acc, recall, precision, fpr, macro, n in records:
              print(f'{name} | {acc:.4f} | {recall:.4f} | {precision:.4f} | {fpr:.4f} | {macro:.4f} | {n}')
          if len(records) != 5 or len({row[-1] for row in records}) != 1:
              raise SystemExit('benchmark candidates did not share the expected holdout')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ml-fixed-seed-benchmark-manifests
          path: backend/artifacts/accuracy-benchmark/*.manifest.json
          if-no-files-found: error
          retention-days: 14
