name: Renew desktop

on:
  pull_request:
    paths:
      - "desktop/renew/**"
      - ".github/workflows/renew-desktop.yml"
  push:
    paths:
      - "desktop/renew/**"
      - ".github/workflows/renew-desktop.yml"

permissions:
  contents: read

jobs:
  mygo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop/renew
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: desktop/renew/go.sum
      - name: Download module dependencies
        run: go mod download
      - name: Test desktop shell
        run: go test ./...
      - name: Compile desktop shell
        run: go build ./...
      - name: Package Linux desktop app
        run: go tool mygo build -platform linux/amd64
