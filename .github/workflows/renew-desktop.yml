name: Renew desktop

on:
  pull_request:
    paths:
      - "desktop/renew/**"
      - ".github/workflows/renew-desktop.yml"
  push:
    paths:
      - "desktop/renew/**"
      - ".github/workflows/renew-desktop.yml"

permissions:
  contents: read

jobs:
  mygo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop/renew
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: desktop/renew/go.sum
      - name: Download desktop dependencies
        run: go mod download
      - name: Test desktop shell
        run: go test ./...
      - name: Compile desktop shell
        run: go build ./...
      - name: Package Linux desktop app
        run: go tool mygo build -platform linux/amd64
      - name: Upload Renew Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: renew-linux-amd64
          path: |
            desktop/renew/build/linux-amd64/renew
            desktop/renew/build/linux-amd64/renew.desktop
            desktop/renew/build/linux-amd64/renew_0.1.0_amd64.deb
            desktop/renew/build/linux-amd64/renew-0.1.0-linux-amd64.tar.gz
            desktop/renew/build/linux-amd64/install.sh
          if-no-files-found: error
