name: Renew desktop

on:
  pull_request:
    paths:
      - "desktop/renew/**"
      - "backend/**"
      - "proto/**"
      - "scripts/renew-desktop.sh"
      - "go.work"
      - ".github/workflows/renew-desktop.yml"
  push:
    paths:
      - "desktop/renew/**"
      - "backend/**"
      - "proto/**"
      - "scripts/renew-desktop.sh"
      - "go.work"
      - ".github/workflows/renew-desktop.yml"

permissions:
  contents: read

jobs:
  mygo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/renew
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: |
            desktop/renew/go.sum
            backend/go.sum
      - name: Install embedded backend build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - name: Prepare embedded backend sources
        working-directory: ${{ github.workspace }}
        run: ./scripts/renew-desktop.sh prepare
      - name: Check module and checksum consistency
        run: go mod tidy -diff
      - name: Download desktop dependencies
        run: go mod download
      - name: Download backend dependencies
        working-directory: ${{ github.workspace }}/backend
        run: go mod download
      - name: Test desktop single binary
        run: go test ./...
      - name: Vet MyGo native UI element lifetimes
        run: go tool mygo vet .
      - name: Compile desktop single binary
        run: go build ./...
      - name: Compile pure-Go embedded backend path
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build ./...
      - name: Package Linux desktop app
        run: go tool mygo build -skip-build-command -platform linux/amd64
      - name: Verify self-elevating single-binary layout
        run: |
          test -x build/linux-amd64/renew
          file build/linux-amd64/renew | grep -q 'ELF'
          if find build/linux-amd64 -type f \( -name agent-ebpf-filter -o -name renew-askpass.sh \) -print -quit | grep -q .; then
            echo "unexpected backend/askpass sidecar in packaged Renew" >&2
            exit 1
          fi
          set +e
          probe_output="$(./build/linux-amd64/renew --internal-backend --desktop-port -1 2>&1)"
          probe_status=$?
          set -e
          printf '%s\n' "$probe_output"
          test "$probe_status" -ne 0
          printf '%s\n' "$probe_output" | grep -q -- 'invalid desktop backend port'
      - name: Verify Ghostty runtime is packaged
        run: |
          # GoRex/MyGo terminals require the verified native libghostty-vt
          # resource. The complete Linux package must work without fetching
          # a native library at runtime.
          find build/linux-amd64 -type f -name libghostty-vt.so -print
          test -n "$(find build/linux-amd64 -type f -name libghostty-vt.so -print -quit)"
          tar -tzf build/linux-amd64/renew-0.1.0-linux-amd64.tar.gz | grep -q 'libghostty-vt.so'
      - name: Upload standalone Renew executable
        uses: actions/upload-artifact@v4
        with:
          name: renew-linux-amd64-single-binary
          path: desktop/renew/build/linux-amd64/renew
          if-no-files-found: error
      - name: Upload Renew Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: renew-linux-amd64
          path: |
            desktop/renew/build/linux-amd64/renew.desktop
            desktop/renew/build/linux-amd64/renew_0.1.0_amd64.deb
            desktop/renew/build/linux-amd64/renew-0.1.0-linux-amd64.tar.gz
            desktop/renew/build/linux-amd64/install.sh
          if-no-files-found: error
