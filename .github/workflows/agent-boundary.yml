name: Agent boundary and watchdog

on:
  push:
    paths:
      - "backend/internal/agentboundary/**"
      - "backend/app/research/**"
      - ".github/workflows/agent-boundary.yml"
  pull_request:
    paths:
      - "backend/internal/agentboundary/**"
      - "backend/app/research/**"
      - ".github/workflows/agent-boundary.yml"

permissions:
  contents: read

jobs:
  boundary-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Boundary and watchdog tests
        working-directory: backend
        run: go test ./internal/agentboundary -count=1
      - name: Verify formatting
        run: |
          files="$(gofmt -l backend/internal/agentboundary/*.go backend/app/research/safety_boundary*.go)"
          test -z "$files" || { gofmt -d backend/internal/agentboundary/*.go backend/app/research/safety_boundary*.go; exit 1; }

  research-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto \
            proto/tracker_events.proto \
            proto/tracker_registration.proto \
            proto/tracker_system.proto \
            proto/tracker_config.proto \
            proto/tracker_shell.proto
      - name: Generate eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Research integration regressions
        working-directory: backend
        run: go test ./app/research ./internal/detectionengineering -count=1
