name: one-shot L7 sampling fast gates

on:
  push:
    branches:
      - perf/l7-sampling-fast-gates

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/l7-sampling-fast-gates
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply L7 sampling fast gates
        run: python3 .github/scripts/one_shot_l7_sampling_fast_gates.py
      - name: Format source contract test
        run: gofmt -w backend/app/runtime_tracking_mode_source_test.go
      - name: Assert protocol gates precede scratch lookups
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c = Path('backend/ebpf/agent_tracker_common.h').read_text()
          s = Path('backend/ebpf/agent_tracker_syscalls.h').read_text()
          for needle in ('classify_http1_start_line', 'capture_http1_start_line_kind'):
              if needle not in c:
                  raise SystemExit(f'missing split HTTP helper: {needle}')
          def check(name, exit_side=False):
              marker = f'int tracepoint__syscalls__sys_{"exit" if exit_side else "enter"}_{name}(struct trace_event_raw_sys_enter *ctx) {{'
              if exit_side:
                  marker = f'int tracepoint__syscalls__sys_exit_{name}(struct trace_event_raw_sys_exit *ctx) {{'
              start = s.find(marker)
              end = s.find('\n}\n', start)
              block = s[start:end]
              classify = block.find('classify_http1_start_line')
              scratch = block.find('bpf_map_lookup_elem(&exit_path_buf')
              if start < 0 or classify < 0 or scratch < 0 or classify > scratch:
                  raise SystemExit(f'{name} touches scratch before protocol gate')
          for name in ('sendto','write','writev','sendmsg'):
              check(name)
          for name in ('read','readv','recvmsg'):
              check(name, True)
          for macro in ('DEFINE_SIMPLE_ENTER_HANDLER','DEFINE_DUP_HANDLER','DEFINE_ACCEPT_HANDLER'):
              start = s.find(f'#define {macro}')
              end = s.find('\n\n', start)
              block = s[start:end]
              if 'get_enter_tag_id_nopath' not in block or 'bpf_get_current_comm' in block:
                  raise SystemExit(f'{macro} is not PID-first')
          PY
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto proto/tracker_registration.proto \
            proto/tracker_system.proto proto/tracker_config.proto proto/tracker_shell.proto
      - name: Generate repository eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Focused regression tests
        working-directory: backend
        run: |
          go test ./app -run 'Test(TrackingModeFlags|PathRuleFastRejectSourceContract|PIDFirstEnterTrackingSourceContract|PIDFirstNetworkEnterSourceContract|L7ScratchLookupAfterProtocolGateSourceContract|RemainingMacroEnterPathsArePIDFirst|TracepointNameFromTag)' -count=1
          go test ./app/observability -count=1
          go test ./app/captureprofile -count=1
          go test ./app/events -run 'Test(Kernel|BuildKernel|HTTP|Socket|Audit)' -count=1
          go test ./app/tls -run 'Test.*(API|Fingerprint|HTTP|GRPC)' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Verify generated bindings stay clean
        run: git diff --exit-code -- backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/ebpf/agent_tracker_common.h backend/ebpf/agent_tracker_syscalls.h \
            backend/app/runtime_tracking_mode_source_test.go docs/backend/generic-api-capture.md
          git commit -m 'perf(ebpf): gate L7 scratch behind protocol classification'
          git push
