name: Agent context features

on:
  push:
    branches: [master]
    paths:
      - "backend/internal/agentfeatures/**"
      - ".github/workflows/agent-context-features.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/internal/agentfeatures/**"
      - ".github/workflows/agent-context-features.yml"

permissions:
  contents: read

jobs:
  offline-features:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify Go formatting
        run: |
          gofmt -d backend/internal/agentfeatures/*.go || true
          files="$(gofmt -l backend/internal/agentfeatures/*.go)"
          test -z "$files" || { printf 'Unformatted files:\n%s\n' "$files"; exit 1; }
      - name: Offline feature extraction tests
        working-directory: backend
        run: go test -race ./internal/agentfeatures -count=1
