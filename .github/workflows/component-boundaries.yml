name: Component boundaries

on:
  pull_request:
    paths:
      - "backend/internal/agentscope/**"
      - "backend/internal/eventnoise/**"
      - "backend/app/agent_scope_*.go"
      - "backend/app/event_path_filter*.go"
      - ".github/workflows/component-boundaries.yml"
  push:
    paths:
      - "backend/internal/agentscope/**"
      - "backend/internal/eventnoise/**"
      - "backend/app/agent_scope_*.go"
      - "backend/app/event_path_filter*.go"
      - ".github/workflows/component-boundaries.yml"

permissions:
  contents: read

jobs:
  domain-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Pure package tests (no BPF/root required)
        working-directory: backend
        run: go test ./internal/agentscope ./internal/eventnoise -count=1
      - name: Check touched Go file formatting
        run: |
          files="$(gofmt -l backend/internal/agentscope/*.go backend/internal/eventnoise/*.go backend/app/agent_scope_policy.go backend/app/agent_scope_root.go backend/app/event_path_filter.go)"
          test -z "$files" || { echo "$files"; gofmt -d backend/internal/agentscope/*.go backend/internal/eventnoise/*.go backend/app/agent_scope_policy.go backend/app/agent_scope_root.go backend/app/event_path_filter.go; exit 1; }
