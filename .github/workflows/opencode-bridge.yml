name: OpenCode interception bridge
on:
  pull_request:
    paths:
      - 'adapters/opencode/**'
      - 'scripts/research/opencode-interception-20261018/**'
      - '.github/workflows/opencode-bridge.yml'
  workflow_dispatch:
    inputs:
      run_live:
        description: Run real free-model disposable-fixture evaluation
        type: boolean
        default: false
      model:
        description: OpenCode free model ID (no credentials used)
        type: choice
        options:
          - opencode/big-pickle
          - opencode/deepseek-v4.1-flash-free
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test adapters/opencode/agent-filter.test.mjs
      - run: python3 -m unittest discover -s scripts/research/opencode-interception-20261018 -p 'test_*.py' -v
  live-fixtures:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/opencode-tools opencode-ai@1.19.3 --no-audit --no-fund
      - name: Real OpenCode fixture evaluation (no kernel enforcement claim)
        env:
          FIXTURE_MODEL: ${{ inputs.model }}
        run: |
          python3 scripts/research/opencode-interception-20261018/run.py \
            --opencode /tmp/opencode-tools/node_modules/.bin/opencode \
            --state /tmp/opencode-state --out /tmp/opencode-results \
            --models "$FIXTURE_MODEL" --timeout 60
      - name: Reconcile native calls, controls and immutable log checksums
        run: python3 scripts/research/opencode-interception-20261018/audit_results.py --results /tmp/opencode-results --require-complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-fixture-evaluation
          path: |
            /tmp/opencode-results/protocol.json
            /tmp/opencode-results/runs.json
            /tmp/opencode-results/summary.json
            /tmp/opencode-results/measurement_audit.json
            /tmp/opencode-results/logs
          retention-days: 7
