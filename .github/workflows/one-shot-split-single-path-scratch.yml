name: one-shot split single path scratch

on:
  push:
    branches:
      - perf/split-single-path-scratch

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/split-single-path-scratch
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply single-path scratch optimization
        run: python3 .github/scripts/one_shot_split_single_path_scratch.py
      - name: Assert scratch routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c = Path('backend/ebpf/agent_tracker_common.h').read_text()
          t = Path('backend/ebpf/agent_tracker_tail.h').read_text()
          r = Path('backend/app/runtime_ebpf.go').read_text()
          if 'exit_single_path_buf SEC(".maps")' not in c:
              raise SystemExit('missing 256-byte single-path per-CPU scratch map')
          for fn in ('execve', 'openat', 'mkdirat', 'unlinkat'):
              start = c.index(f'int tracepoint__syscalls__sys_enter_{fn}')
              end = c.index('\n}\n', start)
              block = c[start:end]
              if 'exit_single_path_buf' not in block or 'exit_path_buf' in block.replace('exit_single_path_buf', ''):
                  raise SystemExit(f'{fn} not routed exclusively through single scratch')
          for macro in ('SYS_PATH0', 'SYS_PATH1', 'SYS_PATH4'):
              start = t.index(f'#define {macro}(name, nr)')
              end = t.find('\n// ── Macro:', start + 10)
              if end < 0: end = len(t)
              block = t[start:end]
              if 'exit_single_path_buf' not in block:
                  raise SystemExit(f'{macro} missing single scratch')
          for macro in ('SYS_PATH01', 'SYS_PATH13', 'SYS_PATH02'):
              start = t.index(f'#define {macro}(name, nr)')
              end = t.find('\n// ── Macro:', start + 10)
              if end < 0: end = len(t)
              block = t[start:end]
              if 'exit_path_buf' not in block or 'exit_single_path_buf' in block:
                  raise SystemExit(f'{macro} should stay on pair scratch')
          if '"exit_single_path_buf"' not in r or 'objs.ExitSinglePathBuf' not in r:
              raise SystemExit('runtime pin/load list missing single scratch map')
          PY
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto proto/tracker_registration.proto \
            proto/tracker_system.proto proto/tracker_config.proto proto/tracker_shell.proto
      - name: Generate repository eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Compile runtime with generated map layout
        working-directory: backend
        run: go test ./app -run '^TestTracepointNameFromTag$' -count=1
      - name: Capture and audit regression tests
        working-directory: backend
        run: |
          go test ./app/captureprofile -count=1
          go test ./app/events -run 'Test(Kernel|BuildKernel|HTTP|Socket|Audit)' -count=1
          go test ./app/tls -run 'Test.*(API|Fingerprint|HTTP|GRPC)' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Assert generated map bindings
        run: |
          grep -q 'ExitSinglePathBuf.*ebpf:"exit_single_path_buf"' backend/ebpf/agenttracker_bpfel.go
          grep -q 'ExitSinglePathBuf.*ebpf:"exit_single_path_buf"' backend/ebpf/agenttracker_bpfeb.go
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/runtime_ebpf.go backend/ebpf/agent_tracker_common.h backend/ebpf/agent_tracker_tail.h \
            backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go docs/backend/generic-api-capture.md
          git commit -m 'perf(ebpf): split single-path per-cpu scratch'
          git push
