name: ML curated corpus quality
on:
  pull_request:
    paths:
      - scripts/ml-curate-corpus.py
      - scripts/test_ml_curate_corpus.py
      - scripts/test_ml_reviewed_annotations.py
      - research/curated/ai-reviewed-bash-actions.jsonl
      - research/curated/ai-review-needs-context.jsonl
      - research/curated/ai-review-manifest.json
      - backend/app/decision_training*.go
      - backend/app/dataset_identity.go
      - backend/app/dataset_identity_test.go
      - backend/app/dataset_sanitize.go
      - backend/app/dataset_sanitize_test.go
      - backend/app/remotedatasets_test.go
      - backend/app/dataset_parsers.go
      - backend/app/remote_datasets.go
      - backend/cmd/ml-train/**
      - .github/workflows/ml-curated-corpus.yml
  push:
    paths:
      - scripts/ml-curate-corpus.py
      - scripts/test_ml_curate_corpus.py
      - scripts/test_ml_reviewed_annotations.py
      - research/curated/ai-reviewed-bash-actions.jsonl
      - research/curated/ai-review-needs-context.jsonl
      - research/curated/ai-review-manifest.json
      - backend/app/dataset_identity.go
      - backend/app/dataset_identity_test.go
      - backend/app/dataset_sanitize.go
      - backend/app/dataset_sanitize_test.go
      - backend/app/remotedatasets_test.go
      - backend/app/dataset_parsers.go
      - backend/app/remote_datasets.go
      - .github/workflows/ml-curated-corpus.yml
permissions:
  contents: read
jobs:
  curated-jsonl:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify deterministic splits, explicit labels and leak isolation
        run: |
          python3 -m unittest discover -s scripts -p 'test_ml_curate_corpus.py' -v
          python3 -m unittest discover -s scripts -p 'test_ml_reviewed_annotations.py' -v

  curated-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            backend/go.sum
      - name: Install eBPF code generation prerequisites
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto \
            proto/tracker_events.proto \
            proto/tracker_registration.proto \
            proto/tracker_system.proto \
            proto/tracker_config.proto \
            proto/tracker_shell.proto
      - name: Generate eBPF bindings
        working-directory: backend/ebpf
        run: |
          go generate
          go generate gen_tls.go
          go generate gen_cgroup.go
          go generate gen_lsm.go
      - name: Test ML corpus provenance and external holdout rules
        working-directory: backend
        run: go test ./app -run 'TestDecision(TrainingLocalDataset|ExternalEvaluation|CandidateLocalCorpus)' -count=1 -v
      - name: Test public path semantics and credential redaction
        working-directory: backend
        run: go test ./app -run 'Test(DatasetIdentity|SanitizeRemoteDataset|PullRemoteDatasetFromClassicCSVWithCleaning)' -count=1 -v
      - name: Build AI-reviewed labeled model candidate (never deployed)
        working-directory: backend
        run: |
          digest="$(sha256sum ../research/curated/ai-reviewed-bash-actions.jsonl | cut -d' ' -f1)"
          go run ./cmd/ml-train \
            --dataset-file ../research/curated/ai-reviewed-bash-actions.jsonl \
            --dataset-sha256 "$digest" \
            --dataset-license CC-BY-SA-4.0 \
            --output artifacts/ai-reviewed-model-candidate.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ai-reviewed-command-candidate
          path: |
            backend/artifacts/ai-reviewed-model-candidate.bin
            backend/artifacts/ai-reviewed-model-candidate.bin.manifest.json
          if-no-files-found: error
          retention-days: 7
