name: Public privacy training experiment
on:
  push:
    branches: ['research/kernel-http-features-20261018']
    paths: ['scripts/research/decision-training-20261021/public-training-request.json']
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/research/deep-optimization-20261018/requirements.txt
      - name: Install pinned CPU research environment
        run: python -m pip install -r scripts/research/deep-optimization-20261018/requirements.txt
      - name: Record request and environment
        run: |
          mkdir -p _research_run
          cp scripts/research/decision-training-20261021/public-training-request.json _research_run/request.json
          git rev-parse HEAD > _research_run/source_commit.txt
          python -m pip freeze > _research_run/environment.txt
          python -c "import torch; assert torch.__version__ == '2.14.1+cpu'; print(torch.__version__)"
      - name: Verify pinned public privacy assets
        run: python scripts/research/decision-training-20261021/fetch_privacy_assets.py --assets _research_assets | tee _research_run/downloads.log
      - name: Reproduce scenario-disjoint public preparation
        run: python scripts/research/deep-optimization-20261018/prepare_public.py --assets _research_assets | tee _research_run/preparation.log
      - name: Train two candidates and freeze before consumed-test regression
        timeout-minutes: 35
        run: |
          python scripts/research/decision-training-20261021/train_privacy_v2.py \
            --assets _research_assets --mini _research_assets/base_mini \
            --out _research_run/privacy --epochs 6 --batch-size 16 --max-trials 2 \
            | tee _research_run/training.log
      - name: Preserve research weights and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-public-v5-${{ github.run_id }}
          path: |
            _research_run/
            _research_assets/agent_privacy_data/manifest.json
            _research_assets/raw/PrivacyAlign_README.md
            _research_assets/base_mini/README.md
          if-no-files-found: warn
          retention-days: 30
