name: one-shot exit path fastpath

on:
  push:
    branches:
      - perf/kernel-exit-path-fastpath

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/kernel-exit-path-fastpath
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply exit-path fast path
        run: python3 .github/scripts/one_shot_exit_path_fastpath.py
      - name: Assert dynamic-only outgoing exit context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('backend/ebpf/agent_tracker_syscalls.h').read_text()
          for literal in ['socket write', 'socket writev', 'socket sendmsg', 'socket sendto']:
              if f'__builtin_memcpy(pd->path, "{literal}"' in s:
                  raise SystemExit(f'static label still persisted through exit_path_ctx: {literal}')
          if 'meta.extra2 == 1 && (meta.socket_type & SOCK_TYPE_MASK) == SOCK_STREAM && meta.addr_ptr != 0' not in s:
              raise SystemExit('recvmsg stream gate missing')
          if s.count('fill_dynamic_http_exit(e, pid_tgid)') != 4:
              raise SystemExit('expected four dynamic outgoing HTTP exits')
          PY
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto proto/tracker_registration.proto \
            proto/tracker_system.proto proto/tracker_config.proto proto/tracker_shell.proto
      - name: Generate repository eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Capture regression tests
        working-directory: backend
        run: |
          go test ./app/captureprofile -count=1
          go test ./app/events -run 'Test(Kernel|BuildKernel|HTTP|Socket)' -count=1
          go test ./app/tls -run 'Test.*(API|Fingerprint|HTTP|GRPC)' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Verify generated binding drift
        run: git diff --exit-code -- backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/ebpf/agent_tracker_syscalls.h docs/backend/generic-api-capture.md
          git commit -m 'perf(ebpf): persist exit path only for dynamic HTTP'
          git push
