name: CodeCity Makepad visualizer

on:
  pull_request:
    paths:
      - "desktop/visualizer-makepad/**"
      - ".github/workflows/codecity-makepad.yml"
  push:
    branches: [master]
    paths:
      - "desktop/visualizer-makepad/**"
      - ".github/workflows/codecity-makepad.yml"
  workflow_dispatch:

permissions:
  contents: read

# An active renderer build is superseded by a newer CodeCity commit.
concurrency:
  group: codecity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Makepad Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libssl-dev libx11-dev \
            libxcursor-dev libxkbcommon-dev libxrandr-dev libxi-dev \
            libxinerama-dev libasound2-dev libpulse-dev libwayland-dev \
            wayland-protocols libegl1-mesa-dev libgl1-mesa-dev \
            libglx-dev libdrm-dev libgbm-dev
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/visualizer-makepad
      - name: Check Makepad Rust visualizer
        run: cargo check --manifest-path desktop/visualizer-makepad/Cargo.toml
      - name: Test read-only event model and binary
        run: cargo test --manifest-path desktop/visualizer-makepad/Cargo.toml
