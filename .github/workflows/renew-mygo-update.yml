name: Renew MyGo updates

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  # A reviewed workflow change can start one immediate, verified update cycle.
  # The first stage keeps the token read-only while executing upstream code.
  push:
    branches: [master]
    paths:
      - ".github/workflows/renew-mygo-update.yml"

# Never run new upstream code with a write-capable GitHub token.
permissions:
  contents: read

concurrency:
  group: renew-mygo-updates
  cancel-in-progress: false

jobs:
  verify-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    defaults:
      run:
        working-directory: desktop/renew
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: desktop/renew/go.sum
      - name: Install embedded backend build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - name: Prepare embedded backend sources
        working-directory: ${{ github.workspace }}
        run: ./scripts/renew-desktop.sh prepare
      - name: Compare pinned and latest stable MyGo
        id: version
        run: |
          pinned="$(go list -m -f '{{.Version}}' github.com/egoist/mygo)"
          latest="$(go list -m -f '{{.Version}}' github.com/egoist/mygo@latest)"
          echo "Pinned: ${pinned}; latest stable: ${latest}"
          if [ "$pinned" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update module and checksums
        if: steps.version.outputs.changed == 'true'
        run: |
          go get github.com/egoist/mygo@latest
          go mod tidy
      - name: Verify native desktop tests and build
        if: steps.version.outputs.changed == 'true'
        run: |
          go test ./...
          go tool mygo vet .
          go build ./...
      - name: Save verified module files for the PR job
        if: steps.version.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: renew-mygo-verified-module
          path: |
            desktop/renew/go.mod
            desktop/renew/go.sum
          if-no-files-found: error
          retention-days: 2

  propose:
    needs: verify-update
    if: needs.verify-update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: renew-mygo-verified-module
          path: desktop/renew
      - name: Open reviewable dependency pull request
        id: propose-pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: deps/renew-mygo
          delete-branch: true
          title: "build(renew): follow latest stable MyGo"
          commit-message: "build(renew): update MyGo Go module and checksums"
          body: |
            Automated stable MyGo dependency refresh for Renew's isolated native desktop module.
            Read-only CI ran go mod tidy, native desktop unit tests, MyGo UI
            lifetime vet, and go build. Standard PR CI additionally checks
            the Linux embedded backend and packaged desktop executable.

            Review upstream release notes and any UI changes before merging.
            This workflow intentionally does not auto-merge.
          add-paths: |
            desktop/renew/go.mod
            desktop/renew/go.sum

      # Some repositories forbid GITHUB_TOKEN PR creation even with an explicit
      # pull-requests:write job permission. Preserve the pushed review branch
      # and provide an actionable link without relaxing repository settings.
      - name: Explain manual PR creation when Actions lacks permission
        if: steps.propose-pr.outcome == 'failure'
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin deps/renew-mygo >/dev/null 2>&1; then
            echo "::warning::GitHub Actions cannot open PRs here. Verified MyGo module changes are available on deps/renew-mygo."
            {
              echo "### Manual dependency PR required"
              echo ""
              echo "The tested version and checksum files were pushed, but GitHub Actions"
              echo "is not allowed to create pull requests in this repository."
              echo ""
              echo "Open a PR from [deps/renew-mygo](https://github.com/${{ github.repository }}/compare/master...deps/renew-mygo?expand=1),"
              echo "review release notes, and require the normal Renew desktop CI before merging."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Dependency proposal failed before creating a reviewable branch."
            exit 1
          fi
