name: Renew MyGo updates

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renew-mygo-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/renew
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: desktop/renew/go.sum
      - name: Update to the latest stable MyGo module
        run: |
          go get github.com/egoist/mygo@latest
          go mod tidy
      - name: Verify native desktop tests and build
        run: |
          go test ./...
          go tool mygo vet .
          go build ./...
      - name: Open reviewable dependency pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: deps/renew-mygo
          delete-branch: true
          title: "build(renew): follow latest stable MyGo"
          commit-message: "build(renew): update MyGo Go module and checksums"
          body: |
            Automated stable MyGo dependency refresh for Renew's isolated native desktop module.
            The updater ran go mod tidy, desktop unit tests, MyGo UI lifetime vet,
            and go build. Standard Renew PR CI additionally validates the embedded
            Linux backend and desktop package.

            Review upstream release notes and any UI behavior changes before merging.
            This workflow intentionally does not auto-merge.
          add-paths: |
            desktop/renew/go.mod
            desktop/renew/go.sum
