name: Paper evidence table validation

on:
  push:
    branches:
      - master
      - 'research/**'
    paths:
      - 'scripts/paper-experiment-tables.py'
      - 'scripts/attribution-concurrent-workload.py'
      - 'backend/app/events/context_event.go'
      - 'backend/app/events/attribution_research_test.go'
      - 'backend/app/sandbox/lsm_bootstrap.go'
      - 'backend/app/sandbox/lsm_readiness_test.go'
      - 'scripts/paper-attribution-ablation-summary.py'
      - 'backend/app/commdefaultstracked.go'
      - 'backend/app/commdefaultstracked_research_test.go'
      - 'backend/app/attribution_cgroup.go'
      - 'backend/app/attribution_cgroup_conflict_test.go'
      - 'backend/app/attribution_cgroup_conflict_integration_test.go'
      - 'scripts/paper-attribution-reconcile.py'
      - 'scripts/tests/test-paper-attribution-reconcile.py'
      - 'scripts/paper-enforcement-trials.py'
      - 'scripts/paper-syscall-latency.go'
      - 'scripts/tests/test-paper-enforcement.py'
      - 'scripts/tests/test-paper-experiment-tables.py'
      - 'scripts/benchmark-concurrent.sh'
      - 'scripts/visualize-concurrent.py'
      - 'docs/testing/paper-three-experiments.md'
      - '.github/workflows/research-evidence.yml'
  pull_request:
    paths:
      - 'scripts/paper-experiment-tables.py'
      - 'scripts/attribution-concurrent-workload.py'
      - 'scripts/paper-enforcement-trials.py'
      - 'scripts/paper-syscall-latency.go'
      - 'scripts/tests/test-paper-enforcement.py'
      - 'scripts/tests/test-paper-experiment-tables.py'
      - 'scripts/benchmark-concurrent.sh'
      - 'scripts/visualize-concurrent.py'
      - 'docs/testing/paper-three-experiments.md'
      - '.github/workflows/research-evidence.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - name: Prepare generated protobuf and eBPF test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y clang llvm libbpf-dev libelf-dev protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto             proto/tracker_common.proto proto/tracker_events.proto             proto/tracker_registration.proto proto/tracker_system.proto             proto/tracker_config.proto proto/tracker_shell.proto
          (cd backend/ebpf && go generate)
      - name: Shared-cgroup ambiguity regressions (real Go code)
        run: go test ./backend/app -run '^(TestCgroupAttribution|TestCgroupAmbiguity|TestResearchAttributionTracks|TestResearchAttributionNever)' -count=1 -v
      - name: Research-mode attribution isolation tests
        run: go test ./backend/app/events -run '^TestResearch' -count=1 -v
      - name: BPF LSM boot readiness checks
        run: go test ./backend/app/sandbox -run '^TestBPFLSMConfigured' -count=1 -v
      - name: Syntax check
        run: |
          python3 -m py_compile \
            scripts/paper-experiment-tables.py \
            scripts/attribution-concurrent-workload.py \
            scripts/paper-attribution-reconcile.py \
            scripts/paper-attribution-ablation-summary.py \
            scripts/tests/test-paper-attribution-reconcile.py \
            scripts/paper-enforcement-trials.py \
            scripts/tests/test-paper-enforcement.py \
            scripts/tests/test-paper-experiment-tables.py
          bash -n scripts/benchmark-concurrent.sh
      - name: Table aggregation unit tests
        run: python3 scripts/tests/test-paper-experiment-tables.py -v
      - name: Live attribution reconciliation unit tests
        run: python3 scripts/tests/test-paper-attribution-reconcile.py -v
      - name: Enforcement recorder unit tests
        run: python3 scripts/tests/test-paper-enforcement.py -v
      - name: Per-call syscall sampler smoke (NOT kernel evidence)
        run: |
          go run scripts/paper-syscall-latency.go --concurrency 2 --samples 32 --warmup 2 --output /tmp/per-call-latency.csv
          test "$(wc -l </tmp/per-call-latency.csv)" -eq 33
      - name: Ensure blank inputs never fabricate measurements
        run: |
          python3 scripts/paper-experiment-tables.py --output /tmp/unmeasured-tables.md
          grep -F 'Not measured' /tmp/unmeasured-tables.md
          grep -F '0/0' /tmp/unmeasured-tables.md
