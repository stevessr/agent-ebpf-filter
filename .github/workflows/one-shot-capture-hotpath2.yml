name: one-shot capture hotpath 2

on:
  push:
    branches:
      - perf/kernel-capture-prefilter

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/kernel-capture-prefilter
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev
      - name: Apply hot-path patch
        run: python3 .github/scripts/one_shot_capture_hotpath2.py
      - name: Format Go sources
        run: gofmt -w backend/app/captureprofile/profile.go backend/app/captureprofile/profile_index.go
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto proto/tracker_registration.proto \
            proto/tracker_system.proto proto/tracker_config.proto proto/tracker_shell.proto
      - name: Generate repository eBPF objects and bindings
        working-directory: backend/ebpf
        run: go generate
      - name: Capture matcher tests and benchmark
        working-directory: backend
        run: |
          go test ./app/captureprofile -count=1
          go test ./app/captureprofile -run '^$' -bench 'BenchmarkRegistryMatch(Compact|Indexed|Linear)512' -benchmem -count=3
      - name: Production capture regression
        working-directory: backend
        run: |
          go test ./app/events -run 'Test(Kernel|BuildKernel|HTTP|Socket)' -count=1
          go test ./app/tls -run 'Test.*(API|Fingerprint|HTTP|GRPC)' -count=1
      - name: Verify main tracker with host kernel verifier
        working-directory: backend
        run: |
          go build -o /tmp/agenttracker-verifier-check ./cmd/agenttracker-verifier-check
          sudo /tmp/agenttracker-verifier-check
      - name: Verify generated bindings are committed-equivalent
        run: git diff --exit-code -- backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go || true
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/captureprofile/profile.go backend/app/captureprofile/profile_index.go backend/ebpf/agent_tracker_common.h backend/ebpf/agent_tracker_syscalls.h backend/ebpf/agenttracker_bpfel.go backend/ebpf/agenttracker_bpfeb.go docs/backend/generic-api-capture.md
          git commit -m 'perf(capture): cut profile copies and reject non-stream L7 probes'
          git push
