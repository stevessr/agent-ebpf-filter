name: one-shot capture A/B benchmark

on:
  push:
    branches:
      - perf/kernel-capture-prefilter

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/kernel-capture-prefilter
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Benchmark optimized head
        working-directory: backend
        run: go test ./app/captureprofile -run '^$' -bench 'BenchmarkRegistryMatch(Compact|Indexed)512' -benchmem -count=10 > /tmp/head.txt
      - name: Benchmark master baseline
        run: |
          git fetch origin master
          git worktree add --detach /tmp/agent-ebpf-master origin/master
          cd /tmp/agent-ebpf-master/backend
          go test ./app/captureprofile -run '^$' -bench 'BenchmarkRegistryMatch(Compact|Indexed)512' -benchmem -count=10 > /tmp/base.txt
      - name: Compare same-runner results
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          echo '--- master ---'
          cat /tmp/base.txt
          echo '--- optimized ---'
          cat /tmp/head.txt
          echo '--- benchstat ---'
          benchstat /tmp/base.txt /tmp/head.txt
