name: Research outcome validation
on:
  pull_request:
    paths: ['backend/app/research/**', 'frontend/src/views/research/**', 'frontend/src/types/config/research.ts', '.github/workflows/research-outcome.yml']
  push:
    branches: [master]
    paths: ['backend/app/research/**', '.github/workflows/research-outcome.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: false
      - name: Test opt-in outcome validation
        run: cd backend && go test ./app/research -count=1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Build frontend
        run: cd frontend && bun install --frozen-lockfile && bun run build
