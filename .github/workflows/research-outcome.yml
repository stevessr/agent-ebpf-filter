name: Research outcome validation
on:
  pull_request:
    paths: ['backend/app/research/**', 'frontend/src/views/research/**', 'frontend/src/types/config/research.ts', '.github/workflows/research-outcome.yml']
  push:
    branches: [master]
    paths: ['backend/app/research/**', '.github/workflows/research-outcome.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: false
      - name: Generate protobuf and eBPF objects
        run: |
          sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev libelf-dev protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto proto/tracker_events.proto \
            proto/tracker_registration.proto proto/tracker_system.proto \
            proto/tracker_config.proto proto/tracker_shell.proto
          (cd backend/ebpf && go generate)
      - name: Test opt-in outcome validation
        run: cd backend && go test ./app/research -count=1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Build frontend
        run: cd frontend && bun install --frozen-lockfile && bun run build
