name: Refresh Go dependencies

on:
  push:
    branches:
      - chore/go-deps-refresh
    paths:
      - ".github/workflows/go-dependency-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Refresh backend direct dependencies
        working-directory: backend
        env:
          GOTOOLCHAIN: local
        run: |
          go get -u \
            github.com/NVIDIA/go-nvml \
            github.com/cilium/ebpf \
            github.com/cockroachdb/pebble/v2 \
            github.com/creack/pty/v2 \
            github.com/getkin/kin-openapi \
            github.com/gin-gonic/gin \
            github.com/gorilla/websocket \
            github.com/modelcontextprotocol/go-sdk \
            github.com/pelletier/go-toml/v2 \
            github.com/shirou/gopsutil/v3 \
            github.com/ulikunitz/xz \
            github.com/vladimirvivien/go4vl \
            go.opentelemetry.io/otel \
            go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp \
            go.opentelemetry.io/otel/sdk \
            go.opentelemetry.io/otel/trace \
            golang.org/x/net \
            golang.org/x/sys \
            google.golang.org/protobuf
          go mod download

      - name: Refresh wrapper direct dependencies
        working-directory: wrapper
        env:
          GOTOOLCHAIN: local
        run: |
          go get -u google.golang.org/protobuf
          go mod download

      - name: Refresh Renew desktop direct dependencies
        working-directory: desktop/renew
        env:
          GOTOOLCHAIN: local
        run: |
          go get -u github.com/egoist/mygo
          go mod download

      - name: Refresh agent TUI direct dependencies
        working-directory: tools/agent-tui
        env:
          GOTOOLCHAIN: local
        run: |
          go get -u \
            github.com/gdamore/tcell/v2 \
            github.com/gorilla/websocket \
            github.com/rivo/tview \
            google.golang.org/protobuf
          go mod download

      - name: Refresh dev environment TUI direct dependencies
        working-directory: tools/dev-env-tui
        env:
          GOTOOLCHAIN: local
        run: |
          go get -u github.com/gdamore/tcell/v2 github.com/rivo/tview
          go mod download

      - name: Commit dependency refresh
        shell: bash
        run: |
          if git diff --quiet -- '**/go.mod' '**/go.sum'; then
            echo "No Go dependency updates available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/go.mod backend/go.sum \
            wrapper/go.mod wrapper/go.sum \
            desktop/renew/go.mod desktop/renew/go.sum \
            tools/agent-tui/go.mod tools/agent-tui/go.sum \
            tools/dev-env-tui/go.mod tools/dev-env-tui/go.sum
          git commit -m "chore(go): refresh dependencies"
          git push
