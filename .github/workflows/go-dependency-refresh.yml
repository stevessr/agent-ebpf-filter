name: Verify Go dependency refresh

on:
  push:
    branches:
      - chore/go-deps-refresh
    paths:
      - ".github/workflows/go-dependency-refresh.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            wrapper/go.sum
            desktop/renew/go.sum
            tools/agent-tui/go.sum
            tools/dev-env-tui/go.sum

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang llvm libbpf-dev libelf-dev

      - name: Generate protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          mkdir -p backend/pb
          protoc --go_out=backend/pb --go_opt=paths=source_relative -I proto \
            proto/tracker_common.proto \
            proto/tracker_events.proto \
            proto/tracker_registration.proto \
            proto/tracker_system.proto \
            proto/tracker_config.proto \
            proto/tracker_shell.proto

      - name: Generate eBPF bindings
        working-directory: backend/ebpf
        run: go generate

      - name: Tidy upgraded Go modules
        run: |
          (cd backend && go mod tidy)
          (cd wrapper && go mod tidy)
          (cd desktop/renew && go mod tidy)
          (cd tools/agent-tui && go mod tidy)
          (cd tools/dev-env-tui && go mod tidy)

      - name: Align split genproto modules
        working-directory: backend
        env:
          GOTOOLCHAIN: local
        run: |
          go get go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.47.0
          go mod tidy
          # CockroachDB still declares the pre-split root module. Keep a post-split
          # root version as an indirect MVS floor so api/rpc come only from submodules.
          go mod edit -require=google.golang.org/genproto@v0.0.0-20260928230214-8a89bd6388cc
          go mod download google.golang.org/genproto

      - name: Diagnose genproto module graph
        working-directory: backend
        run: |
          echo "== genproto graph edges =="
          go mod graph | grep 'google.golang.org/genproto' || true
          echo "== why monolithic genproto =="
          go mod why -m google.golang.org/genproto || true

      - name: Test backend
        working-directory: backend
        run: go test ./... -count=1

      - name: Test wrapper
        working-directory: wrapper
        run: go test ./... -count=1

      - name: Test Renew desktop
        working-directory: desktop/renew
        run: |
          go test ./... -count=1
          go build ./...

      - name: Test agent TUI
        working-directory: tools/agent-tui
        run: |
          go test ./... -count=1
          go build ./...

      - name: Test dev environment TUI
        working-directory: tools/dev-env-tui
        run: |
          go test ./... -count=1
          go build ./...

      - name: Commit compatible dependency graph
        if: success()
        shell: bash
        run: |
          if git diff --quiet -- '**/go.mod' '**/go.sum'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/go.mod backend/go.sum \
            wrapper/go.mod wrapper/go.sum \
            desktop/renew/go.mod desktop/renew/go.sum \
            tools/agent-tui/go.mod tools/agent-tui/go.sum \
            tools/dev-env-tui/go.mod tools/dev-env-tui/go.sum
          git commit -m "chore(go): tidy upgraded dependency graph"
          git push
